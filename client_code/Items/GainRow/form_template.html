<div class="rs-gain-wrap">
  <div class="rs-gain" anvil:name="box" anvil:on-dom:click="self.box_click" anvil:on-dom:keydown="self.box_key">
    <anvil-component type="Label" name="icon_label" prop:role='["rs-gain-ic", "emoji"]'></anvil-component>
    <div class="rs-gain-txt">
      <anvil-component type="Label" name="title_label" prop:role='["strong"]'></anvil-component>
      <anvil-component type="Label" name="text_label" prop:role='["rs-gain-sub"]'></anvil-component>
    </div>
  </div>
</div>
