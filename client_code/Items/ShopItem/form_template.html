<div class="sh-wrap">
  <div class="sh" anvil:name="card">
    <div class="pv"><anvil-component type="Doremi_Road.Components.Art" name="preview"></anvil-component></div>
    <div>
      <anvil-component type="Label" name="name_label" prop:role='["sh-name"]'></anvil-component>
      <anvil-component type="Label" name="desc_label" prop:role='["sh-desc"]'></anvil-component>
    </div>
    <div class="sh-row">
      <anvil-component type="Label" name="status_label" prop:role='["sh-status"]'></anvil-component>
      <anvil-component type="Button" name="use_button" prop:text="Use" prop:role='["btn", "btn-sm"]'></anvil-component>
      <anvil-component type="Button" name="buy_button" prop:text="Buy" prop:role='["btn", "btn-sm"]'></anvil-component>
    </div>
  </div>
</div>
