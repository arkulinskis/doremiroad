<div class="hw-wrap">
  <div class="hw-row" anvil:name="row">
    <span class="hw-tick" anvil:dom-node="tick" aria-hidden="true"></span>
    <div class="hw-txt">
      <anvil-component type="Label" name="title_label" prop:role='["hw-title"]'></anvil-component>
      <anvil-component type="Label" name="sub_label" prop:role='["hw-sub"]'></anvil-component>
    </div>
    <anvil-component type="Button" name="play_button" prop:text="Play ▸" prop:role='["btn", "btn-sm", "btn-primary"]'></anvil-component>
    <anvil-component type="Button" name="remove_button" prop:text="Remove" prop:role='["btn", "btn-sm", "btn-ghost"]'></anvil-component>
  </div>
</div>
