<div class="a-lv-wrap">
  <div class="a-lv" anvil:name="row">
    <anvil-component type="Link" name="name_link" prop:role='["a-lv-name"]'></anvil-component>
    <anvil-component type="Label" name="err_chip" prop:role='["a-chip", "err"]'></anvil-component>
    <anvil-component type="Label" name="draft_chip" prop:role='["a-chip", "draft"]' prop:text="draft"></anvil-component>
    <anvil-component type="Label" name="bi_chip" prop:role='["a-chip", "bi"]' prop:text="built-in"></anvil-component>
    <anvil-component type="Button" name="up_button" prop:text="▲" prop:role='["a-mv"]' prop:tooltip="Move up"></anvil-component>
    <anvil-component type="Button" name="down_button" prop:text="▼" prop:role='["a-mv"]' prop:tooltip="Move down"></anvil-component>
  </div>
</div>
