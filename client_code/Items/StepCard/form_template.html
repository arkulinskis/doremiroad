<div class="a-step-wrap">
  <section class="a-step" anvil:name="card">
    <div class="a-sh">
      <anvil-component type="Label" name="num_label" prop:role='["a-n"]'></anvil-component>
      <anvil-component type="Label" name="kind_label" prop:role='["a-kind"]'></anvil-component>
      <anvil-component type="Label" name="summary_label" prop:role='["a-sp"]'></anvil-component>
      <anvil-component type="Button" name="hear_button" prop:text="▶" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Hear it"></anvil-component>
      <anvil-component type="Button" name="up_button" prop:text="▲" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Move up"></anvil-component>
      <anvil-component type="Button" name="down_button" prop:text="▼" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Move down"></anvil-component>
      <anvil-component type="Button" name="dup_button" prop:text="⧉" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Duplicate"></anvil-component>
      <anvil-component type="Button" name="fold_button" prop:text="▾" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Fold"></anvil-component>
      <anvil-component type="Button" name="del_button" prop:text="✕" prop:role='["btn", "btn-ghost", "btn-sm", "a-ic"]' prop:tooltip="Delete"></anvil-component>
    </div>
    <div class="a-sb" anvil:name="body">
      <label class="ui-field" anvil:name="prompt_f"><span>Prompt (shown above the challenge)</span><anvil-component type="TextBox" name="prompt_box"></anvil-component></label>
      <label class="ui-field" anvil:name="title_f"><span>Title</span><anvil-component type="TextBox" name="title_box"></anvil-component></label>
      <label class="ui-field" anvil:name="text_f"><span>Text (a blank line starts a new paragraph)</span><anvil-component type="TextArea" name="text_box"></anvil-component></label>
      <div class="a-row" anvil:name="lesson_row">
        <label class="ui-field"><span>Keys to light up (e.g. C4 E4 G4)</span><anvil-component type="TextBox" name="show_box" prop:role='["mono"]'></anvil-component></label>
        <label class="ui-field narrow"><span>Also show on a staff</span><anvil-component type="DropDown" name="staff_drop"></anvil-component></label>
      </div>
      <label class="ui-field" anvil:name="notes_f"><span>Notes, in order (C4 D#4 Bb3 …)</span><anvil-component type="TextArea" name="notes_box" prop:role='["mono"]'></anvil-component></label>
      <label class="ui-field" anvil:name="chords_f"><span>Chords (C Am G7 Bdim F#m7, or notes like E4+G4+C5)</span><anvil-component type="TextBox" name="chords_box" prop:role='["mono"]'></anvil-component></label>
      <label class="ui-field" anvil:name="labels_f"><span>Labels, one per line (optional: replaces the note name, e.g. "A 5th above C")</span><anvil-component type="TextArea" name="labels_box"></anvil-component></label>
      <div class="a-row" anvil:name="prog_row">
        <label class="ui-field narrow"><span>Key (C, G, Bb, Am…)</span><anvil-component type="TextBox" name="key_box" prop:role='["mono"]'></anvil-component></label>
        <label class="ui-field"><span>Roman numerals (I IV V7 vi ii7 vii°)</span><anvil-component type="TextBox" name="numerals_box" prop:role='["mono"]'></anvil-component></label>
      </div>
      <label class="ui-field" anvil:name="seq_f"><span>Notes in time: C4 = 1 beat, C4:2 = 2 beats, C4:0.5 = half, C4+E4+G4 = together, {Am}:4 = a chord, r:1 = rest, | = bar line</span><anvil-component type="TextArea" name="seq_box" prop:role='["mono"]'></anvil-component></label>
      <div class="a-row" anvil:name="opts_row">
        <label class="ui-field narrow" anvil:name="showmode_f"><span>Show the player</span><anvil-component type="DropDown" name="showmode_drop"></anvil-component></label>
        <label class="ui-field narrow" anvil:name="clef_f"><span>Clef</span><anvil-component type="DropDown" name="clef_drop"></anvil-component></label>
        <label class="ui-field narrow" anvil:name="mode_f"><span>Plays</span><anvil-component type="DropDown" name="mode_drop"></anvil-component></label>
        <label class="ui-field narrow" anvil:name="bpm_f"><span>Tempo (BPM)</span><anvil-component type="TextBox" name="bpm_box" prop:type="number"></anvil-component></label>
        <label class="ui-field narrow" anvil:name="count_f"><span>Questions</span><anvil-component type="TextBox" name="count_box" prop:type="number"></anvil-component></label>
        <anvil-component type="CheckBox" name="hint_box" prop:role='["a-check"]'></anvil-component>
        <anvil-component type="CheckBox" name="names_box" prop:text="Show chord names under the numerals" prop:role='["a-check"]'></anvil-component>
        <anvil-component type="CheckBox" name="exact_box" prop:role='["a-check"]'></anvil-component>
      </div>
      <label class="ui-field" anvil:name="pool_f"><span>Notes it may play (C4 E4 G4)</span><anvil-component type="TextBox" name="pool_box" prop:role='["mono"]'></anvil-component></label>
      <div class="ui-field" anvil:name="poolchips_f"><span>Answers to choose from</span>
        <anvil-component type="RepeatingPanel" name="pool_panel" prop:item_template="Doremi_Road.Items.Chip" prop:role='["a-chips"]'></anvil-component>
      </div>
      <div anvil:name="quiz_f">
        <label class="ui-field"><span>Question</span><anvil-component type="TextBox" name="q_box"></anvil-component></label>
        <div class="ui-field"><span>Answers (tick the right one; empty ones are skipped; the game shuffles them)</span>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans0"></anvil-component><anvil-component type="TextBox" name="opt0"></anvil-component></div>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans1"></anvil-component><anvil-component type="TextBox" name="opt1"></anvil-component></div>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans2"></anvil-component><anvil-component type="TextBox" name="opt2"></anvil-component></div>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans3"></anvil-component><anvil-component type="TextBox" name="opt3"></anvil-component></div>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans4"></anvil-component><anvil-component type="TextBox" name="opt4"></anvil-component></div>
          <div class="a-opt"><anvil-component type="RadioButton" name="ans5"></anvil-component><anvil-component type="TextBox" name="opt5"></anvil-component></div>
        </div>
        <label class="ui-field"><span>Explanation (shown after answering)</span><anvil-component type="TextBox" name="explain_box"></anvil-component></label>
      </div>
      <anvil-component type="Label" name="preview_label" prop:role='["a-prev"]'></anvil-component>
    </div>
  </section>
</div>
