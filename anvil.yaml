allow_embedding: false
db_schema:
  levels:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: key
      type: string
    - admin_ui: {order: 1, width: 200}
      name: territory
      target: territories
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: name
      type: string
    - admin_ui: {order: 3, width: 200}
      name: position
      type: number
    - admin_ui: {order: 4, width: 200}
      name: data
      type: simpleObject
    - admin_ui: {order: 5, width: 200}
      name: published
      type: bool
    - admin_ui: {order: 6, width: 200}
      name: updated
      type: datetime
    - admin_ui: {order: 7, width: 200}
      name: builtin
      type: bool
    - admin_ui: {order: 8, width: 200}
      name: clears
      type: number
    indexes: []
    server: full
    title: Levels
  scores:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: user
      target: users
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: level
      target: levels
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: score
      type: number
    - admin_ui: {order: 3, width: 200}
      name: accuracy
      type: number
    - admin_ui: {order: 4, width: 200}
      name: stars
      type: number
    - admin_ui: {order: 5, width: 200}
      name: at
      type: datetime
    indexes: []
    server: full
    title: Scores
  territories:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: key
      type: string
    - admin_ui: {order: 1, width: 200}
      name: name
      type: string
    - admin_ui: {order: 2, width: 200}
      name: emoji
      type: string
    - admin_ui: {order: 3, width: 200}
      name: blurb
      type: string
    - admin_ui: {order: 4, width: 200}
      name: color
      type: string
    - admin_ui: {order: 5, width: 200}
      name: x
      type: number
    - admin_ui: {order: 6, width: 200}
      name: y
      type: number
    - admin_ui: {order: 7, width: 200}
      name: position
      type: number
    - admin_ui: {order: 8, width: 200}
      name: published
      type: bool
    indexes: []
    server: full
    title: Territories
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: false
      name: display_name
      type: string
    - admin_ui: {order: 8, width: 200}
      client_hidden: false
      name: is_admin
      type: bool
    - admin_ui: {order: 9, width: 200}
      client_hidden: false
      name: progress
      type: simpleObject
    - admin_ui: {order: 10, width: 200}
      client_hidden: false
      name: last_played
      type: datetime
    indexes: []
    server: full
    title: Users
metadata: {logo_img: 'asset:Gemini_Generated_Image_xjjsiuxjjsiuxjjs.jpg', title: Doremi Road}
name: Doremi Road
native_deps:
  head_html: |
    <!-- Doremi Road — Native Libraries. tools/sync_to_anvil.py puts this (plus lib/*.js and every form's styles and scripts)
         into anvil.yaml → native_deps.head_html. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0d1120">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Music&display=swap" rel="stylesheet">
    <style>
      :root {
        --dr-bg: #0c1020;
        --dr-bg-2: #121830;
        --dr-panel: #171e36;
        --dr-panel-2: #1f2744;
        --dr-panel-3: #283157;
        --dr-line: rgba(232, 212, 168, .14);
        --dr-line-2: rgba(232, 212, 168, .28);
        --dr-ink: #f0e7d3;
        --dr-ink-2: #c4bba6;
        --dr-soft: #8d8a7e;
        --dr-gold: #e2b25a;
        --dr-gold-2: #b8893a;
        --dr-gold-soft: rgba(226, 178, 90, .16);
        --dr-crimson: #c8434e;
        --dr-green: #4cb37d;
        --dr-blue: #5b8fd9;
        --dr-red: #e0605a;
        --dr-violet: #9a7ad6;
        --dr-radius: 14px;
        --dr-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        --dr-font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --dr-title: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        --dr-caps: 'Cinzel', 'Cormorant Garamond', Georgia, serif;
        --dr-music: 'Noto Music', 'Segoe UI Symbol', 'Bravura', serif;
        --dr-emoji: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      }
      html, body { margin: 0; padding: 0; background: var(--dr-bg); color: var(--dr-ink); font-family: var(--dr-font);
        -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      .dr, .dr * { box-sizing: border-box; }
      .dr { font-family: var(--dr-font); color: var(--dr-ink); font-size: 15px; line-height: 1.45; }
      .dr h1, .dr h2, .dr h3, .dr h4 { font-family: var(--dr-title); font-weight: 600; margin: 0; line-height: 1.1; letter-spacing: .2px; }
      .dr button { font-family: var(--dr-font); cursor: pointer; }
      .dr input, .dr select, .dr textarea { font-family: var(--dr-font); font-size: 14px; color: var(--dr-ink); }
      .dr ::selection { background: rgba(226, 178, 90, .35); }
      .dr ::-webkit-scrollbar { width: 10px; height: 10px; }
      .dr ::-webkit-scrollbar-thumb { background: rgba(232, 212, 168, .18); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
      .dr ::-webkit-scrollbar-track { background: transparent; }

      /* Buttons */
      .dr-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--dr-line-2);
        background: var(--dr-panel-2); color: var(--dr-ink); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 10px;
        transition: transform .08s, background .15s, border-color .15s, box-shadow .15s, opacity .15s; user-select: none; white-space: nowrap; }
      .dr-btn:hover { background: var(--dr-panel-3); border-color: rgba(232, 212, 168, .45); }
      .dr-btn:active { transform: translateY(1px) scale(.99); }
      .dr-btn:focus-visible { outline: 2px solid var(--dr-gold); outline-offset: 2px; }
      .dr-btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
      .dr-btn.gold { background: linear-gradient(180deg, #ecc271, #c99a45); border-color: #f3d48f; color: #1d160a;
        box-shadow: 0 6px 18px rgba(226, 178, 90, .25), inset 0 1px 0 rgba(255, 255, 255, .35); }
      .dr-btn.gold:hover { background: linear-gradient(180deg, #f2cb7e, #d0a24c); }
      .dr-btn.crimson { background: linear-gradient(180deg, #d4545f, #a8323d); border-color: #e57a83; color: #fff; }
      .dr-btn.ghost { background: transparent; border-color: transparent; color: var(--dr-ink-2); }
      .dr-btn.ghost:hover { color: var(--dr-ink); background: rgba(255, 255, 255, .05); }
      .dr-btn.small { font-size: 13px; padding: 6px 12px; border-radius: 8px; }
      .dr-btn.big { font-size: 17px; padding: 14px 28px; border-radius: 12px; }
      .dr-card { background: linear-gradient(180deg, var(--dr-panel), #141a30); border: 1px solid var(--dr-line); border-radius: var(--dr-radius);
        box-shadow: var(--dr-shadow); }
      .dr-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, .04); border: 1px solid var(--dr-line);
        border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; white-space: nowrap; }
      .dr-emoji { font-family: var(--dr-emoji); font-style: normal; line-height: 1; }
      .dr-music { font-family: var(--dr-music); }
      .dr-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; text-align: left; }
      .dr-field label { font-weight: 600; font-size: 12px; color: var(--dr-ink-2); letter-spacing: .3px; text-transform: uppercase; }
      .dr-input { width: 100%; border: 1px solid var(--dr-line-2); border-radius: 9px; padding: 10px 12px; background: rgba(0, 0, 0, .25); outline: none; }
      .dr-input:focus { border-color: var(--dr-gold); box-shadow: 0 0 0 3px rgba(226, 178, 90, .2); }
      .dr-err { color: var(--dr-red); font-weight: 600; font-size: 13px; min-height: 1.2em; }
      .dr-muted { color: var(--dr-soft); }
      .dr-gold-text { color: var(--dr-gold); }
      .dr-rule { height: 1px; background: linear-gradient(90deg, transparent, var(--dr-line-2), transparent); border: 0; margin: 14px 0; }

      /* Modal + toast */
      .dr-modal-bg { position: fixed; inset: 0; background: rgba(5, 7, 15, .66); display: flex; align-items: center; justify-content: center;
        z-index: 1000; padding: 16px; animation: drFade .18s ease-out; backdrop-filter: blur(3px); }
      .dr-modal { position: relative; max-width: 540px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 26px;
        animation: drPop .28s cubic-bezier(.2, 1.2, .4, 1); }
      .dr-modal.wide { max-width: 760px; }
      .dr-modal .dr-x { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--dr-line);
        background: rgba(255, 255, 255, .04); color: var(--dr-ink-2); font-size: 16px; line-height: 1; }
      .dr-modal .dr-x:hover { color: var(--dr-ink); border-color: var(--dr-line-2); }
      .dr-toasts { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column;
        gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
      .dr-toast { background: var(--dr-panel-2); border: 1px solid var(--dr-line-2); border-radius: 10px; padding: 9px 16px; font-weight: 600;
        box-shadow: var(--dr-shadow); animation: drDrop .3s cubic-bezier(.2, 1.3, .4, 1); text-align: center; font-size: 14px; }
      .dr-toast.err { border-color: rgba(224, 96, 90, .6); background: #3a1b22; }
      .dr-toast.gold { border-color: var(--dr-gold); background: linear-gradient(180deg, #3d3220, #2a2416); color: #f6dfae; }
      @keyframes drFade { from { opacity: 0; } }
      @keyframes drPop { from { transform: scale(.94) translateY(8px); opacity: 0; } }
      @keyframes drDrop { from { transform: translateY(-16px); opacity: 0; } }
      @keyframes drSpin { to { transform: rotate(360deg); } }
      @keyframes drPulse { 50% { transform: scale(1.06); } }
      @keyframes drGlow { 50% { opacity: .55; } }
      @keyframes drRise { from { transform: translateY(10px); opacity: 0; } }

      /* Anvil's loading spinner (shown during server calls) → a turning gold ring with a note. */
      #loadingSpinner { --anvil-spinner-size: 76px; width: 76px; height: 76px; border-radius: 50%;
        background: radial-gradient(circle closest-side, #171e36 86%, transparent 88%) !important; box-shadow: 0 8px 30px rgba(0, 0, 0, .5); }
      #loadingSpinner > svg, #loadingSpinner > img { display: none !important; }
      #loadingSpinner::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(226, 178, 90, .18);
        border-top-color: #e2b25a; animation: drSpin .9s linear infinite; }
      #loadingSpinner::after { content: "\266A"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #e2b25a; font: 600 30px 'Cormorant Garamond', Georgia, serif; animation: drPulse 1.2s ease-in-out infinite; }
      .dr-spin { display: inline-block; width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(226, 178, 90, .18);
        border-top-color: var(--dr-gold); animation: drSpin .9s linear infinite; }
      .dr-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: rgba(12, 16, 32, .82); z-index: 900; font-family: var(--dr-title); font-size: 22px; color: var(--dr-ink-2); }
    </style>
    <script>
    (function () {
      'use strict';
      var DR = window.DR = window.DR || {};
      DR.components = DR.components || {};

      /* ---------- Python ⇄ JS bridge ----------
         Python mounts a component with window.DR.mount(name, rootNode, jsonString, emit).
         The component calls emit(event, payload) and gets a Promise of whatever Python returned
         (dr_ui sends it back as a JSON string; we parse it here). */
      DR.wrapEmit = function (emit) {
        return function (name, payload) {
          var r;
          try { r = emit ? emit(name, JSON.stringify(payload == null ? {} : payload)) : null; }
          catch (e) { console.error(e); return Promise.reject(e); }
          return Promise.resolve(r).then(function (v) {
            if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } }
            return v;
          });
        };
      };
      DR.define = function (name, mountFn) { DR.components[name] = mountFn; };
      DR.mount = function (name, root, json, emit) {
        var fn = DR.components[name];
        if (!fn) { console.error('DR component not loaded: ' + name); return null; }
        if (!root) { console.error('DR mount: no root node for ' + name); return null; }
        var data = typeof json === 'string' ? JSON.parse(json || '{}') : (json || {});
        return fn(root, data, DR.wrapEmit(emit));
      };

      /* ---------- small helpers ---------- */
      DR.esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };
      DR.store = {
        get: function (k, dflt) { try { var v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
        set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
        del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
      };
      DR.today = function () {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      };
      DR.isTouch = function () { return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; };
      DR.fmt = function (n) { return Math.round(n).toLocaleString('en-US'); };

      /* Player settings, kept in this browser. */
      var SETTINGS_DEFAULT = { sfx: true, ambient: true, keySound: true, midiSound: false, labels: 'c', letters: true, volume: 0.8, metronome: true };
      DR.settings = Object.assign({}, SETTINGS_DEFAULT, DR.store.get('dr.settings', {}));
      DR.saveSettings = function () { DR.store.set('dr.settings', DR.settings); };

      DR.toast = function (msg, kind) {
        var box = document.querySelector('.dr-toasts');
        if (!box) { box = document.createElement('div'); box.className = 'dr dr-toasts'; document.body.appendChild(box); }
        var t = document.createElement('div');
        t.className = 'dr-toast' + (kind === true || kind === 'err' ? ' err' : kind === 'gold' ? ' gold' : '');
        t.innerHTML = msg;
        box.appendChild(t);
        setTimeout(function () { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateY(-8px)'; }, 2800);
        setTimeout(function () { t.remove(); }, 3200);
      };

      // DR.modal(html, {onClose, cls, noClose}) → {el, close}. Clicking the backdrop or × closes it.
      DR.modal = function (html, opts) {
        opts = opts || {};
        var bg = document.createElement('div');
        bg.className = 'dr dr-modal-bg';
        bg.innerHTML = '<div class="dr-card dr-modal ' + (opts.cls || '') + '" role="dialog">' + (opts.noClose ? '' : '<button class="dr-x" aria-label="Close">✕</button>') + html + '</div>';
        document.body.appendChild(bg);
        var closed = false;
        function close() {
          if (closed) return; closed = true;
          bg.remove();
          document.removeEventListener('keydown', onKey, true);
          if (opts.onClose) opts.onClose();
        }
        function onKey(e) { if (e.key === 'Escape' && !opts.noClose) { e.stopPropagation(); close(); } }
        document.addEventListener('keydown', onKey, true);
        bg.addEventListener('click', function (e) {
          if ((e.target === bg && !opts.noClose) || (e.target.closest && e.target.closest('.dr-x'))) { DR.Sound.sfx('click'); close(); }
        });
        return { el: bg.querySelector('.dr-modal'), close: close, bg: bg };
      };

      /* ---------- Sound: a synthesized piano, effects, a metronome and soft ambience (no audio files) ---------- */
      var Sound = DR.Sound = { ctx: null, voices: {}, order: [] };
      Sound.init = function () {
        if (Sound.ctx) { if (Sound.ctx.state === 'suspended') Sound.ctx.resume(); return Sound.ctx; }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
          var c = Sound.ctx = new AC({ latencyHint: 'interactive' });
          Sound.master = c.createGain(); Sound.master.gain.value = DR.settings.volume;
          var comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3;
          Sound.master.connect(comp); comp.connect(c.destination);
          // a small synthetic room
          var len = Math.floor(c.sampleRate * 1.8), imp = c.createBuffer(2, len, c.sampleRate);
          for (var ch = 0; ch < 2; ch++) { var d = imp.getChannelData(ch); for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
          Sound.verb = c.createConvolver(); Sound.verb.buffer = imp;
          var wet = c.createGain(); wet.gain.value = 0.22; Sound.verb.connect(wet); wet.connect(Sound.master);
          Sound.piano = c.createGain(); Sound.piano.gain.value = 0.9; Sound.piano.connect(Sound.master); Sound.piano.connect(Sound.verb);
          Sound.fx = c.createGain(); Sound.fx.gain.value = 0.55; Sound.fx.connect(Sound.master);
          Sound.amb = c.createGain(); Sound.amb.gain.value = 0.32; Sound.amb.connect(Sound.master); Sound.amb.connect(Sound.verb);
        } catch (e) { Sound.ctx = null; }
        return Sound.ctx;
      };
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, function () { Sound.init(); if (Sound.wantAmbient) Sound.ambient(Sound.wantAmbient); }, { passive: true });
      });
      Sound.setVolume = function (v) { DR.settings.volume = v; DR.saveSettings(); if (Sound.master) Sound.master.gain.value = v; };
      function freq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      // One piano-ish voice: a few partials with a falling filter, a hammer tick and a pitch-dependent decay.
      function voice(midi, vel, when, dest) {
        var c = Sound.ctx, f = freq(midi), t = when || c.currentTime;
        var g = c.createGain(), filt = c.createBiquadFilter();
        var v = 0.18 + 0.32 * (vel == null ? 0.75 : vel);
        var decay = Math.max(0.35, Math.min(2.6, 1.5 * Math.pow(2, -(midi - 60) / 22)));
        filt.type = 'lowpass'; filt.Q.value = 0.7;
        filt.frequency.setValueAtTime(Math.min(12000, f * 9), t);
        filt.frequency.setTargetAtTime(Math.min(6000, f * 2.6), t + 0.01, decay * 0.35);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(v, t + 0.006);
        g.gain.setTargetAtTime(v * 0.42, t + 0.008, 0.09);
        g.gain.setTargetAtTime(0.0001, t + 0.12, decay);
        filt.connect(g); g.connect(dest || Sound.piano);
        var parts = [[1, 'triangle', 1], [1.0015, 'sawtooth', 0.12], [2, 'sine', 0.32], [3, 'sine', 0.1], [4.02, 'sine', 0.04]];
        var oscs = parts.map(function (p) {
          var o = c.createOscillator(), og = c.createGain();
          o.type = p[1]; o.frequency.value = f * p[0]; og.gain.value = p[2];
          o.connect(og); og.connect(filt); o.start(t); return o;
        });
        // hammer
        var n = Math.floor(c.sampleRate * 0.03), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
        for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        var src = c.createBufferSource(), bp = c.createBiquadFilter(), hg = c.createGain();
        src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = Math.min(8000, f * 5); hg.gain.value = v * 0.35;
        src.connect(bp); bp.connect(hg); hg.connect(dest || Sound.piano); src.start(t);
        var stopAt = t + decay * 5 + 0.3;
        oscs.forEach(function (o) { o.stop(stopAt); });
        return { g: g, oscs: oscs, release: function (at) {
          var tt = Math.max(at || c.currentTime, t + 0.02);
          g.gain.cancelScheduledValues(tt); g.gain.setTargetAtTime(0.0001, tt, 0.07);
          oscs.forEach(function (o) { try { o.stop(tt + 0.6); } catch (e) {} });
        } };
      }
      Sound.noteOn = function (midi, vel) {
        if (!Sound.init()) return;
        if (Sound.voices[midi]) Sound.voices[midi].release();
        Sound.voices[midi] = voice(midi, vel);
        Sound.order.push(midi);
        if (Sound.order.length > 28) { var old = Sound.order.shift(); if (Sound.voices[old] && old !== midi) { Sound.voices[old].release(); delete Sound.voices[old]; } }
      };
      Sound.noteOff = function (midi) {
        var v = Sound.voices[midi];
        if (v) { v.release(); delete Sound.voices[midi]; }
      };
      // Play notes for listening: items are MIDI numbers or arrays (chords). Returns the duration in seconds.
      Sound.play = function (items, opts) {
        if (!Sound.init()) return 0;
        opts = opts || {};
        var gap = opts.gap || 0.55, dur = opts.dur || gap * 0.95, t = Sound.ctx.currentTime + 0.05;
