          return r;
        }
        function load() {
          var p = st.guest ? call('guest_state', [DR.store.get(GUEST_KEY, null), DR.today()]) : call('get_state', [DR.today()]);
          return p.then(function (r) {
            if (!r || !r.ok) { DR.toast(esc((r && r.error) || 'Could not load the road.'), 'err'); return r; }
            return apply(r);
          });
        }
        function act(name, args, text) {
          var a = st.guest ? [st.progress].concat(args || [], [DR.today()]) : (args || []).concat([DR.today()]);
          if (text) busy(true, text);
          return call(st.guest ? 'guest_' + name : name, a).then(function (r) {
            busy(false);
            if (!r || !r.ok) { DR.toast(esc((r && r.error) || 'Something went wrong.'), 'err'); return r; }
            return apply(r);
          });
        }

        /* ---------- lookups ---------- */
        function rec(key) { return (st.progress.levels || {})[key] || { stars: 0, best: 0, score: 0, clears: 0 }; }
        function isUnlocked(key) { return st.status.unlocked.indexOf(key) >= 0; }
        function allLevels() { var out = []; st.journey.forEach(function (t) { t.levels.forEach(function (l, i) { out.push({ t: t, l: l, i: i }); }); }); return out; }
        function findLevel(key) { return allLevels().filter(function (x) { return x.l.key === key; })[0]; }
        function terrState(t) {
          if (st.status.mastered.indexOf(t.key) >= 0) return 'mastered';
          if (st.status.conquered.indexOf(t.key) >= 0) return 'conquered';
          return t.levels.some(function (l) { return isUnlocked(l.key); }) ? 'open' : 'locked';
        }
        function currentTerr() {
          for (var i = 0; i < st.journey.length; i++) {
            var t = st.journey[i];
            if (t.levels.some(function (l) { return isUnlocked(l.key) && !rec(l.key).stars; })) return t;
          }
          var open = st.journey.filter(function (t) { return terrState(t) !== 'locked'; });
          return open[open.length - 1] || st.journey[0];
        }
        function nextLevel(key) {
          var all = allLevels(), i = all.findIndex(function (x) { return x.l.key === key; });
          for (var j = i + 1; j < all.length; j++) if (isUnlocked(all[j].l.key)) return all[j];
          return null;
        }
        function codexWhere() {
          var w = {};
          allLevels().forEach(function (x) { (x.l.data.codex || []).forEach(function (k) { if (!w[k]) w[k] = x; }); });
          return w;
        }
        function cardWhere() {
          var w = {};
          allLevels().forEach(function (x) { var c = x.l.data.cards || {}; ['clear', 'three'].forEach(function (h) { if (c[h] && !w[c[h]]) w[c[h]] = { x: x, how: h }; }); });
          return w;
        }
        function em(e) { return '<span class="dr-emoji">' + e + '</span>'; }
        function stars(n, max) { var s = ''; for (var i = 0; i < (max || 3); i++) s += i < n ? '★' : '<span class="off">★</span>'; return s; }
        function bannerColor() { var b = C.shop.banners[st.progress.equip.banners]; return b ? b.color : '#c8434e'; }
        function stepCount(data) { return DR.Engine.levelItems(data); }

        function clear() {
          if (st.cleanup) { try { st.cleanup(); } catch (e) {} st.cleanup = null; }
          if (titleAnim) { titleAnim.stop(); titleAnim = null; }
          if (stage) { stage.destroy(); stage = null; }
          root.innerHTML = '';
        }

        /* ---------- title ---------- */
        function renderTitle() {
          clear();
          st.screen = 'title';
          root.innerHTML = '<div class="g-screen g-title"><canvas></canvas><div class="g-title-in">' +
            '<div class="g-solf">DO · RE · MI · FA · SOL · LA · TI</div>' +
            '<h1 class="g-logo">Doremi <i>Road</i></h1>' +
            '<div class="g-tag">Learn the piano one milestone at a time. Read, hear and play your way across the Realm of Harmony.</div>' +
            '<div class="g-title-btns">' + (st.signedIn ? '<button class="dr-btn gold big" data-a="continue">Continue the journey</button><button class="dr-btn big" data-a="signout">Sign out</button>'
              : '<button class="dr-btn gold big" data-a="guest">Begin the journey</button><button class="dr-btn big" data-a="login">Sign in</button>') + '</div>' +
            '<div class="g-inputs"><span class="dr-pill v-midi"></span><span class="dr-pill">⌨️ or your computer keyboard</span><span class="dr-pill">🖱️ or click the keys</span></div>' +
            '</div><div class="g-foot"><a data-a="how">How to play</a>' + (st.signedIn ? '' : '<a data-a="signup">Create an account</a>') + '</div></div>';
          titleAnim = DR.Art.titleScene(root.querySelector('canvas'));
          midiPill(root.querySelector('.v-midi'));
          var off = DR.Input.on(function (t) { if (t === 'midi') midiPill(root.querySelector('.v-midi')); });
          st.cleanup = off;
          root.querySelector('.g-title').addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]');
            if (!a) return;
            DR.Sound.sfx('click');
            var w = a.dataset.a;
            if (w === 'guest') startGuest();
            else if (w === 'continue') startSignedIn();
            else if (w === 'login' || w === 'signup') authModal(w);
            else if (w === 'how') howTo();
            else if (w === 'midi') DR.Input.enableMidi(false).then(function () { midiPill(root.querySelector('.v-midi')); });
            else if (w === 'signout') emit('logout').then(function () { st.signedIn = false; renderTitle(); });
          });
        }
        function midiPill(el) {
          if (!el) return;
          var mi = DR.Input.midi;
          if (mi.status === 'on') el.innerHTML = '🎹 <b>' + esc(mi.inputs[0]) + '</b> connected';
          else if (mi.status === 'unsupported') el.innerHTML = '🎹 MIDI needs Chrome or Edge';
          else if (mi.status === 'denied') el.innerHTML = '🎹 MIDI was blocked by the browser';
          else if (mi.status === 'ready') el.innerHTML = '🎹 No MIDI keyboard found · plug one in';
          else el.innerHTML = '<a data-a="midi" style="cursor:pointer;color:var(--dr-gold)">🎹 Connect a MIDI keyboard</a>';
        }
        function howTo() {
          DR.modal('<h2 style="font-size:30px;margin-bottom:12px">How to play</h2><ul class="how" style="padding-left:18px;line-height:1.55">' +
            '<li><b>Travel the road.</b> Each territory of the knowledge map teaches one part of music. Clear a level to claim one of its provinces; clear them all to conquer the territory and unlock the next.</li>' +
            '<li><b>Play with anything.</b> A MIDI keyboard (Chrome or Edge), your computer keyboard (<span class="kbd">Z</span>–<span class="kbd">M</span> and <span class="kbd">Q</span>–<span class="kbd">U</span> are two octaves, black keys on the row above, <span class="kbd">↑</span><span class="kbd">↓</span> shift octave) or the mouse.</li>' +
            '<li><b>Challenges.</b> Lessons teach; note and chord steps check you can find things; progressions use Roman numerals; rushes drop notes onto the keys in time; ear training asks what you hear; quizzes test the theory.</li>' +
            '<li><b>Stars.</b> 60% accuracy clears a level, 80% earns two stars, 95% three. Three stars on some levels earn composer cards.</li>' +
            '<li><b>Collect.</b> Codex pages, 20 composer cards, territory crests, 32 badges, ranks from Novice to Legend, and keyboards, note trails and banners from the shop, paid in ducats.</li>' +
            '<li><b>Practise daily.</b> A fresh Daily Practice every day; keep a streak for bigger rewards. The Practice Room names any chord you play.</li></ul>', { cls: 'wide' });
        }
        function authModal(mode) {
          var m = DR.modal('<div class="v-auth"></div>');
          var box = m.el.querySelector('.v-auth');
          function draw(mode2, msg) {
            var signup = mode2 === 'signup', reset = mode2 === 'reset';
            box.innerHTML = '<h2 style="font-size:30px;margin-bottom:6px">' + (signup ? 'Create an account' : reset ? 'Reset your password' : 'Welcome back') + '</h2>' +
              '<p class="dr-muted" style="margin:0 0 16px">' + (signup ? 'Your progress is saved to your account and you appear on the leaderboards. Anything you did as a guest comes with you.' : reset ? 'We\'ll email you a link.' : 'Sign in to pick up where you left off.') + '</p>' +
              '<form>' + (signup ? '<div class="dr-field"><label>Your name</label><input class="dr-input" name="name" maxlength="24" autocomplete="nickname"></div>' : '') +
              '<div class="dr-field"><label>Email</label><input class="dr-input" name="email" type="email" required autocomplete="email"></div>' +
              (reset ? '' : '<div class="dr-field"><label>Password</label><input class="dr-input" name="password" type="password" required autocomplete="' + (signup ? 'new-password' : 'current-password') + '"></div>') +
              '<div class="dr-err">' + esc(msg || '') + '</div><button class="dr-btn gold" style="width:100%;margin-top:6px">' + (signup ? 'Create account' : reset ? 'Send link' : 'Sign in') + '</button></form>' +
              '<p style="text-align:center;font-size:13px;margin:14px 0 0" class="dr-muted">' +
              (signup ? 'Have an account? <a href="#" data-m="login">Sign in</a>' : reset ? '<a href="#" data-m="login">Back to sign in</a>' : 'New here? <a href="#" data-m="signup">Create an account</a> · <a href="#" data-m="reset">Forgot password?</a>') + '</p>';
            box.querySelectorAll('a').forEach(function (a) { a.style.color = 'var(--dr-gold)'; });
            var f = box.querySelector('form');
            f.addEventListener('submit', function (e) {
              e.preventDefault();
              var v = {}; Array.prototype.forEach.call(f.elements, function (x) { if (x.name) v[x.name] = x.value; });
              busy(true, signup ? 'Creating your account…' : 'Signing in…');
              emit(mode2, v).then(function (r) {
                busy(false);
                if (!r || !r.ok) { box.querySelector('.dr-err').textContent = (r && r.error) || 'Something went wrong.'; return; }
                if (r.mode) { draw(r.mode, r.message); return; }
                m.close(); onSignedIn(signup);
              });
            });
            box.querySelectorAll('[data-m]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); draw(a.dataset.m); }); });
            var first = box.querySelector('input'); if (first) setTimeout(function () { first.focus(); }, 50);
          }
          draw(mode);
        }
        function onSignedIn(isNew) {
          st.signedIn = true; st.guest = false;
          busy(true, 'Opening your map…');
          var g = DR.store.get(GUEST_KEY, null);
          var p = g ? call('import_guest', [g, DR.today()]) : call('get_state', [DR.today()]);
          p.then(function (r) {
            busy(false);
            if (!r || !r.ok) { DR.toast(esc((r && r.error) || 'Could not load your progress.'), 'err'); return; }
            apply(r);
            if (g) DR.store.del(GUEST_KEY);
            DR.toast('Signed in as <b>' + esc(st.me.name) + '</b>', 'gold');
            renderHub(st.tab);
          });
        }
        function startSignedIn() { st.guest = false; busy(true, 'Opening your map…'); load().then(function (r) { busy(false); if (r && r.ok) renderHub(); }); }
        function startGuest() { st.guest = true; busy(true, 'Unrolling the map…'); load().then(function (r) { busy(false); if (r && r.ok) renderHub(); }); }

        /* ---------- hub ---------- */
        var TABS = [['map', 'Map'], ['codex', 'Codex'], ['collection', 'Collection'], ['practice', 'Practice Room'], ['badges', 'Badges'], ['shop', 'Shop']];
        function renderHub(tab) {
          clear();
          st.screen = 'hub';
          st.tab = tab || st.tab || 'map';
          var s = st.status, r = s.rank, p = st.progress;
          var pct = r.next ? Math.round(100 * (r.xp - r.from) / (r.next - r.from)) : 100;
          root.innerHTML = '<div class="g-screen g-hub">' +
            '<header class="g-bar"><div class="g-brand" data-a="title">Doremi <i>Road</i></div>' +
            '<nav class="g-tabs">' + TABS.map(function (t) {
              return '<button class="g-tab' + (st.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + (t[0] === 'shop' && canBuyAny() ? '<span class="dot"></span>' : '') + '</button>';
            }).join('') + '</nav>' +
            '<div class="g-me"><div class="g-rank" data-a="profile" title="' + DR.fmt(r.xp) + ' XP"><b>' + esc(r.name) + '<small>' + (r.next ? DR.fmt(r.xp) + ' / ' + DR.fmt(r.next) + ' XP' : DR.fmt(r.xp) + ' XP') + '</small></b><div class="g-xp"><i style="width:' + pct + '%"></i></div></div>' +
            '<span class="dr-pill" title="Ducats">🪙 ' + DR.fmt(p.ducats) + '</span>' +
            (st.daily.streak ? '<span class="dr-pill" title="Daily practice streak">🔥 ' + st.daily.streak + '</span>' : '') +
            '<button class="g-avatar" data-a="profile" aria-label="Profile and settings">' + esc((st.me.name || '?').charAt(0).toUpperCase()) + '</button></div></header>' +
            '<main class="g-panel"></main></div>';
          var panel = root.querySelector('.g-panel');
          ({ map: renderMap, codex: renderCodex, collection: renderCollection, practice: renderPractice, badges: renderBadges, shop: renderShop }[st.tab] || renderMap)(panel);
          DR.Sound.ambient(st.tab !== 'practice');
          root.querySelector('.g-bar').addEventListener('click', function (e) {
            var t = e.target.closest('[data-tab]'), a = e.target.closest('[data-a]');
            if (t) { DR.Sound.sfx('click'); renderHub(t.dataset.tab); }
            else if (a && a.dataset.a === 'profile') { DR.Sound.sfx('click'); profile(); }
            else if (a && a.dataset.a === 'title') { DR.Sound.sfx('click'); renderTitle(); }
          });
        }
        function canBuyAny() {
          return Object.keys(st.catalog.shop).some(function (k) {
            return st.catalog.shop[k].some(function (x) { return x.price > 0 && x.price <= st.progress.ducats && st.progress.owned[k].indexOf(x.key) < 0; });
          });
        }

        /* ---------- map ---------- */
        function renderMap(panel) {
          var cur = currentTerr();
          if (!st.sel || !st.journey.some(function (t) { return t.key === st.sel; })) st.sel = cur.key;
          var cleared = {};
          Object.keys(st.progress.levels).forEach(function (k) { cleared[k] = st.progress.levels[k].stars; });
          panel.innerHTML = '<div class="m-wrap"><div class="m-mapbox">' + DR.Art.map(st.journey, { cleared: cleared, unlocked: st.status.unlocked,
            conquered: st.status.conquered, mastered: st.status.mastered, banner: bannerColor(), current: cur.key, selected: st.sel }) +
            '</div><aside class="m-side"><div class="v-daily"></div><div class="v-terr"></div></aside></div>';
          drawDaily(panel.querySelector('.v-daily'));
          drawTerr(panel.querySelector('.v-terr'));
          panel.querySelector('.m-mapbox').addEventListener('click', function (e) {
            var g = e.target.closest('.m-terr');
            if (!g) return;
            var t = st.journey.filter(function (x) { return x.key === g.dataset.t; })[0];
            if (!t) return;
            DR.Sound.sfx('page');
            st.sel = t.key;
            panel.querySelectorAll('.m-terr').forEach(function (n) { n.classList.toggle('sel', n.dataset.t === t.key); });
            drawTerr(panel.querySelector('.v-terr'));
          });
          panel.querySelector('.m-mapbox').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest('.m-terr')) e.target.closest('.m-terr').dispatchEvent(new MouseEvent('click', { bubbles: true })); });
          panel.querySelector('.m-side').addEventListener('click', function (e) {
            var b = e.target.closest('[data-lv]'), d = e.target.closest('[data-a="daily"]');
            if (b && !b.classList.contains('locked')) { DR.Sound.sfx('click'); levelModal(b.dataset.lv); }
            if (d) { DR.Sound.sfx('click'); dailyModal(); }
          });
          if (st.status.conquered.length === st.status.territories_max && st.status.territories_max) {
            var v = document.createElement('div');
            v.className = 'dr-card m-victory';
            v.innerHTML = '<b>👑 The Realm of Harmony is yours</b><div class="dr-muted" style="font-size:13px;margin-top:4px">Every territory conquered. Go back for three stars everywhere, and keep your daily streak.</div>';
            panel.querySelector('.m-side').appendChild(v);
          }
        }
        function drawDaily(el) {
          var d = st.daily;
          el.innerHTML = '<div class="dr-card m-daily"><span class="ic dr-emoji">' + (d.done ? '✅' : '📜') + '</span><div><b>Daily Practice</b><small>' +
            (d.done ? 'Done for today. Come back tomorrow' + (d.streak ? ' to make it ' + (d.streak + 1) + ' days.' : '.') : (d.streak ? '🔥 ' + d.streak + '-day streak. Keep it alive!' : 'A fresh warm-up every day. Build a streak.')) +
            '</small></div><button class="dr-btn ' + (d.done ? 'small' : 'gold small') + '" data-a="daily">' + (d.done ? 'Replay' : 'Start') + '</button></div>';
        }
        function drawTerr(el) {
          var t = st.journey.filter(function (x) { return x.key === st.sel; })[0];
          if (!t) { el.innerHTML = ''; return; }
          var state = terrState(t), done = t.levels.filter(function (l) { return rec(l.key).stars; }).length;
          var starN = t.levels.reduce(function (a, l) { return a + rec(l.key).stars; }, 0);
          var idx = st.journey.indexOf(t), prev = st.journey[idx - 1];
          el.innerHTML = '<div class="dr-card m-terrcard"><div class="m-thead">' + DR.Art.crest(t, state, 54) + '<div><h3>' + esc(t.name) + '</h3><p>' + esc(t.blurb) + '</p></div></div>' +
            '<div class="m-prog"><span>' + done + ' / ' + t.levels.length + ' provinces</span><div class="bar"><i style="width:' + (t.levels.length ? 100 * done / t.levels.length : 0) + '%;background:' + bannerColor() + '"></i></div><span class="m-stars">★ ' + starN + '/' + 3 * t.levels.length + '</span></div>' +
            (state === 'conquered' || state === 'mastered' ? '<div class="dr-muted" style="font-size:12.5px">' + (state === 'mastered' ? '🏆 Mastered: three stars on every level.' : '🚩 Conquered. Three-star every level to master it.') + '</div>' : '') +
            '<div class="m-levels">' + t.levels.map(function (l, i) {
              var r = rec(l.key), open = isUnlocked(l.key), trial = l.data.trial;
              var cls = 'm-lv' + (r.stars ? ' done' : open ? ' open' : ' locked') + (trial ? ' trial' : '');
              var node = '<div class="m-node" style="' + (r.stars ? 'background:' + bannerColor() : '') + '"><span>' + (open || r.stars ? (trial ? '⚑' : i + 1) : '🔒') + '</span></div>';
              var icons = (l.data.steps || []).map(function (s) { return DR.Art.STEP_ICONS[s.t] || ''; }).filter(function (x, j, a) { return a.indexOf(x) === j; }).join(' ');
              return '<button class="' + cls + '" data-lv="' + esc(l.key) + '">' + node + '<div class="m-lvinfo"><b>' + esc(l.name) + '</b><small>' +
                (r.stars ? 'Best ' + Math.round(r.best) + '%' : open ? 'Ready' : 'Locked') + ' · <span class="dr-emoji">' + icons + '</span></small></div>' +
                '<span class="m-stars">' + (open || r.stars ? stars(r.stars) : '') + '</span></button>';
            }).join('') + '</div>' +
            (state === 'locked' ? '<div class="m-locknote">🔒 Conquer ' + esc(prev ? prev.name : 'the territory before') + ' to open this land.</div>' : '') + '</div>';
        }

        /* ---------- level card ---------- */
        function levelModal(key) {
          var x = findLevel(key);
          if (!x) return;
          var l = x.l, d = l.data, r = rec(key), cw = d.cards || {};
          var steps = (d.steps || []).map(function (s) { return '<span class="lv-step"><span class="dr-emoji">' + (DR.Art.STEP_ICONS[s.t] || '') + '</span>' + esc(DR.Art.STEP_NAMES[s.t] || s.t) + '</span>'; }).join('');
          var rewards = (d.codex || []).map(function (k) {
            var c = C.codex[k]; if (!c) return '';
            var have = st.progress.codex.indexOf(k) >= 0;
            return '<div class="lv-reward">📖 <span>' + esc(c.title) + (have ? ' <span class="dr-muted">✓</span>' : '') + '</span></div>';
          }).join('');
          ['clear', 'three'].forEach(function (h) {
            var k = cw[h], c = k && C.composers[k];
            if (!c) return;
            var have = st.progress.cards[k];
            rewards += '<div class="lv-reward">🃏 <span>' + (have ? esc(c.name) : 'A ' + esc(c.rarity) + ' composer card') + ' <span class="dr-muted">(' + (h === 'three' ? '3 stars' : 'clear') + ')' + (have ? ' ✓' : '') + '</span></span></div>';
          });
          if (!rewards) rewards = '<div class="lv-reward dr-muted">XP and ducats</div>';
          var m = DR.modal('<div class="lv-top"><small>' + esc(x.t.name) + (d.trial ? ' · Trial' : ' · Level ' + (x.i + 1)) + '</small><h2>' + esc(l.name) + '</h2><p>' + esc(d.intro || '') + '</p></div>' +
            '<div class="lv-steps">' + steps + '</div>' +
            '<div class="lv-grid"><div class="lv-box"><h4>Your best</h4><div class="m-stars" style="font-size:22px">' + stars(r.stars) + '</div>' +
            '<div style="font-size:13px;margin-top:6px" class="dr-muted">' + (r.stars ? 'Accuracy ' + Math.round(r.best) + '% · score ' + DR.fmt(r.score) + ' · played ' + r.clears + '×' : 'Not cleared yet') + '</div>' +
            '<div style="font-size:12px;margin-top:8px" class="dr-muted">Clear ' + (d.pass == null ? 60 : d.pass) + '% · ★★ ' + (d.two == null ? 80 : d.two) + '% · ★★★ ' + (d.three == null ? 95 : d.three) + '% · ' + stepCount(d) + ' scored items</div></div>' +
            '<div class="lv-box"><h4>Rewards</h4>' + rewards + '</div></div>' +
            '<div class="lv-box"><h4>Leaderboard</h4><div class="lv-board dr-muted" style="font-size:13px">Loading…</div></div>' +
            '<div class="lv-btns"><button class="dr-btn gold big" data-a="go">' + (r.stars ? 'Play again' : 'Play') + ' ▸</button></div>', { cls: 'wide' });
          m.el.querySelector('[data-a="go"]').addEventListener('click', function () { DR.Sound.sfx('click'); m.close(); play(key); });
          call('leaderboard', [key]).then(function (b) { fillBoard(m.el.querySelector('.lv-board'), b); });
        }
        function fillBoard(el, b) {
          if (!el) return;
          if (!b || !b.top || !b.top.length) { el.innerHTML = st.guest ? 'No scores yet. Create an account to post yours.' : 'No scores yet. Be the first.'; return; }
          el.classList.remove('dr-muted');
          el.innerHTML = b.top.slice(0, 5).map(function (r) {
            return '<div class="' + (r.you ? 'you' : '') + '"><span>' + r.rank + '</span><span>' + esc(r.name) + '</span><span>' + DR.fmt(r.score) + ' · ' + Math.round(r.accuracy) + '%</span></div>';
          }).join('') + (b.you && b.you.rank > 5 ? '<div class="you"><span>' + b.you.rank + '</span><span>You</span><span>' + DR.fmt(b.you.score) + '</span></div>' : '') +
            (st.guest ? '<div style="border:0" class="dr-muted"><span></span><span>Sign in to appear here.</span><span></span></div>' : '');
        }
        function dailyModal() {
          var d = st.daily, l = d.level;
          var m = DR.modal('<div class="lv-top"><small>Every day · ' + esc(st.today) + '</small><h2>Daily Practice</h2><p>' + esc(l.data.intro) + '</p></div>' +
            '<div class="lv-steps">' + l.data.steps.map(function (s) { return '<span class="lv-step"><span class="dr-emoji">' + (DR.Art.STEP_ICONS[s.t] || '') + '</span>' + esc(s.prompt || DR.Art.STEP_NAMES[s.t]) + '</span>'; }).join('') + '</div>' +
            '<div class="lv-box"><h4>Rewards</h4>' + (d.done ? '<div class="lv-reward dr-muted">Already done today: practise for fun, rewards return tomorrow.</div>' :
              '<div class="lv-reward">🪙 ' + (st.catalog.rewards.daily_ducats + st.catalog.rewards.daily_streak_bonus * Math.min(d.streak, st.catalog.rewards.daily_streak_cap - 1)) + ' ducats (more with a streak)</div><div class="lv-reward">✨ ' + st.catalog.rewards.xp_daily + ' XP</div><div class="lv-reward">🃏 A chance of a composer card</div>') + '</div>' +
            '<div class="lv-btns"><button class="dr-btn gold big" data-a="go">Start ▸</button></div>');
          m.el.querySelector('[data-a="go"]').addEventListener('click', function () { DR.Sound.sfx('click'); m.close(); play(null, true); });
        }

        /* ---------- play ---------- */
        function play(key, daily) {
          var x = daily ? null : findLevel(key);
          var lvl = daily ? st.daily.level : x && x.l;
          if (!lvl) return;
          clear();
          st.screen = 'play';
          DR.Sound.ambient(false);
          curPlay = { key: key, daily: !!daily, name: lvl.name, t: x && x.t };
          root.innerHTML = '<div class="g-screen g-play"></div>';
          stage = DR.Stage(root.querySelector('.g-play'), lvl, {
            skin: st.progress.equip.skins, trail: st.progress.equip.trails,
            subtitle: daily ? 'Daily Practice · ' + st.today : x.t.name + (lvl.data.trial ? ' · Trial' : ' · Level ' + (x.i + 1)),
            onPause: pauseMenu,
            onFinish: function (result) { submit(result); },
            onFail: function (info) { failCard(info); }
          });
          stage.start();
        }
        function pauseMenu() {
          if (!stage || pauseOpen) return;
          stage.pause();
          pauseOpen = DR.modal('<div class="pz"><h2>Paused</h2><div class="col"><button class="dr-btn gold big" data-a="resume">Resume</button>' +
            '<button class="dr-btn" data-a="restart">Restart level</button><button class="dr-btn" data-a="settings">Settings</button><button class="dr-btn ghost" data-a="quit">Quit to map</button></div></div>',
            { onClose: function () { pauseOpen = null; if (stage) stage.resume(); } });
          pauseOpen.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]');
            if (!a) return;
            DR.Sound.sfx('click');
            var w = a.dataset.a, m = pauseOpen;
            if (w === 'resume') m.close();
            else if (w === 'restart') { pauseOpen = null; m.close(); play(curPlay.key, curPlay.daily); }
            else if (w === 'quit') { pauseOpen = null; m.close(); renderHub('map'); }
            else if (w === 'settings') settingsModal();
          });
        }
        document.addEventListener('visibilitychange', function () { if (document.hidden && st.screen === 'play' && stage && !stage.isPaused() && !stage.state().over) pauseMenu(); });
        window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.screen === 'play' && stage && !pauseOpen && !document.querySelector('.dr-modal-bg') && !stage.state().over) pauseMenu(); });

        function failCard(info) {
          var meter = info.reason === 'meter';
          var m = DR.modal('<div class="rs"><small class="k">' + esc(curPlay.name) + '</small><h2>' + (meter ? 'The harmony broke' : 'Not quite there') + '</h2>' +
            '<p class="dr-muted" style="font-size:15px">' + (meter ? 'Too many misses in a row emptied the harmony meter. Slow down, watch the falling notes, and land them on the line.' :
              'You reached ' + Math.round(info.accuracy) + '% accuracy; this level needs ' + Math.round(info.pass) + '%. Every attempt makes the road shorter.') + '</p>' +
            '<div class="rs-btns"><button class="dr-btn gold big" data-a="retry">Try again</button><button class="dr-btn" data-a="map">Back to the map</button></div></div>', { noClose: true });
          DR.Sound.sfx('fail');
          m.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]'); if (!a) return;
            m.close();
            if (a.dataset.a === 'retry') play(curPlay.key, curPlay.daily); else renderHub('map');
          });
        }
        function submit(result) {
          var cp = curPlay;
          var p = cp.daily ? act('finish_daily', [result], 'Recording your practice…') : act('finish_level', [cp.key, result], 'Recording your performance…');
          p.then(function (r) {
            if (!r || !r.ok) {
              var m = DR.modal('<div class="rs"><h2>That didn\'t save</h2><p class="dr-muted">' + esc((r && r.error) || 'Something went wrong.') + '</p><div class="rs-btns"><button class="dr-btn gold" data-a="retry">Try again</button><button class="dr-btn" data-a="map">Map</button></div></div>', { noClose: true });
              m.el.addEventListener('click', function (e) { var a = e.target.closest('[data-a]'); if (!a) return; m.close(); if (a.dataset.a === 'retry') play(cp.key, cp.daily); else renderHub('map'); });
              return;
            }
            results(r.report, cp);
          });
        }
        function results(rep, cp) {
          var labels = ['Cleared', 'Two stars', 'Three stars'];
          var gains = [];
          if (rep.repeat) gains.push(['🔁', 'Practice run', 'Today\'s rewards are already yours. Come back tomorrow.']);
          if (rep.xp) gains.push(['✨', '+' + rep.xp + ' XP', rep.xp_parts.map(function (x) { return x[0] + ' ' + x[1]; }).join(' · ')]);
          if (rep.ducats) gains.push(['🪙', '+' + rep.ducats + ' ducats', rep.ducat_parts.map(function (x) { return x[0] + ' ' + x[1]; }).join(' · ')]);
          if (rep.streak) gains.push(['🔥', rep.streak + '-day streak', rep.streak > 1 ? 'Consistency is how pianists are made.' : 'Day one. Come back tomorrow for day two.']);
          var html = '';
          (rep.codex || []).forEach(function (k) { var c = C.codex[k]; if (c) gains.push(['📖', 'New Codex page: ' + c.title, 'Tap to read it', 'codex:' + k, 'gold']); });
          (rep.cards || []).forEach(function (k) { var c = C.composers[k]; if (c) gains.push(['🃏', 'Composer card: ' + c.name, st.catalog.rarity[c.rarity].name + ' · tap to view', 'card:' + k, 'gold']); });
          (rep.dupes || []).forEach(function (dd) { var c = C.composers[dd.card]; if (c) gains.push(['🃏', 'Duplicate ' + c.name, 'Sold for ' + dd.ducats + ' ducats']); });
          (rep.new_badges || []).forEach(function (k) { var b = C.badges[k]; if (b) gains.push([b.emoji, 'Badge: ' + b.name, b.desc, null, 'gold']); });
          if (rep.rank_up) gains.push(['🎖️', 'New rank: ' + rep.rank_up, 'Your reputation grows along the road.', null, 'gold']);
          if (rep.new_high) gains.push(['🏅', 'New high score', DR.fmt(rep.high_score)]);
          var conq = rep.conquered && st.journey.filter(function (t) { return t.key === rep.conquered; })[0];
          var nxt = cp.daily ? null : nextLevel(cp.key);
          var unlockedTerr = conq && nxt && nxt.t !== conq ? nxt.t : null;
          if (conq) html += '<div class="rs-conq">' + DR.Art.crest(conq, rep.mastered ? 'mastered' : 'conquered', 60) + '<b>' + esc(conq.name) + ' conquered!</b><span class="dr-muted">' +
            (rep.mastered ? 'And mastered, with three stars on every level.' : 'Its crest is yours.') + (unlockedTerr ? ' The road opens to <b style="color:var(--dr-ink)">' + esc(unlockedTerr.name) + '</b>.' : '') + '</span></div>';
          else if (rep.mastered) { var mt = st.journey.filter(function (t) { return t.key === rep.mastered; })[0]; if (mt) gains.push(['🏆', mt.name + ' mastered', 'Three stars on every level.', null, 'gold']); }
          var m = DR.modal('<div class="rs"><small class="k">' + esc(cp.daily ? 'Daily Practice' : (cp.t ? cp.t.name : '')) + '</small><h2>' + esc(cp.name) + '</h2>' +
            '<div class="rs-stars">' + [0, 1, 2].map(function (i) { return '<div class="rs-star" data-i="' + i + '" title="' + labels[i] + '">★</div>'; }).join('') + '</div>' +
            '<div class="rs-acc">' + Math.round(rep.accuracy) + '%</div><div class="dr-muted" style="font-size:12px;letter-spacing:1px;text-transform:uppercase">accuracy' + (rep.new_best ? ' · new best' : '') + '</div>' +
            '<div class="rs-row"><div><small>Score</small><b>' + DR.fmt(rep.score) + '</b></div>' + (rep.combo ? '<div><small>Best combo</small><b>' + rep.combo + '</b></div>' : '') +
            (rep.first_clear ? '<div><small>Province</small><b style="color:var(--dr-gold)">Claimed</b></div>' : '') + '</div>' + html +
            '<div class="rs-gains">' + gains.map(function (g, i) {
              return '<div class="rs-gain ' + (g[4] || '') + (g[3] ? ' click' : '') + '" style="animation-delay:' + (0.5 + i * 0.12) + 's"' + (g[3] ? ' data-open="' + esc(g[3]) + '"' : '') + '><span class="ic dr-emoji">' + g[0] + '</span><div><b>' + esc(g[1]) + '</b><small>' + esc(g[2] || '') + '</small></div></div>';
            }).join('') + '</div>' +
            (rep.leaderboard && rep.leaderboard.you ? '<div class="dr-muted" style="font-size:13px">Leaderboard: #' + rep.leaderboard.you.rank + ' of ' + rep.leaderboard.total + '</div>' : '') +
            '<div class="rs-btns">' + (nxt ? '<button class="dr-btn gold big" data-a="next">Next: ' + esc(nxt.l.name) + ' ▸</button>' : '') +
            '<button class="dr-btn" data-a="again">Play again</button><button class="dr-btn' + (nxt ? '' : ' gold') + '" data-a="map">Back to the map</button></div></div>', { noClose: true, cls: 'wide' });
          DR.Sound.sfx('win');
          [0, 1, 2].forEach(function (i) {
            setTimeout(function () {
              if (i < rep.stars) { m.el.querySelector('.rs-star[data-i="' + i + '"]').classList.add('on'); DR.Sound.sfx('star'); }
            }, 450 + i * 320);
          });
          if (conq) setTimeout(function () { DR.Sound.sfx('conquer'); }, 1400);
          else if ((rep.cards || []).length) setTimeout(function () { DR.Sound.sfx('card'); }, 1400);
          m.el.addEventListener('click', function (e) {
            var o = e.target.closest('[data-open]');
            if (o) { var parts = o.dataset.open.split(':'); if (parts[0] === 'codex') codexModal(parts[1]); else cardModal(parts[1]); return; }
            var a = e.target.closest('[data-a]'); if (!a) return;
            DR.Sound.sfx('click');
            m.close();
            if (a.dataset.a === 'next') { st.sel = nxt.t.key; play(nxt.l.key); }
            else if (a.dataset.a === 'again') play(cp.key, cp.daily);
            else { if (cp.t) st.sel = (unlockedTerr || cp.t).key; renderHub('map'); }
          });
        }

        /* ---------- codex ---------- */
        function renderCodex(panel) {
          var where = codexWhere(), have = st.progress.codex;
          panel.innerHTML = '<div class="g-page"><h2>The Codex</h2><p class="lede">Every idea you learn on the road, written down. ' + have.length + ' of ' + st.catalog.codex.length + ' pages unlocked.</p>' +
            st.catalog.topics.map(function (tp) {
              var pages = st.catalog.codex.filter(function (c) { return c.topic === tp.key; });
              if (!pages.length) return '';
              return '<div class="g-sec"><h3>' + esc(tp.name) + '</h3><span>' + pages.filter(function (c) { return have.indexOf(c.key) >= 0; }).length + ' / ' + pages.length + '</span></div><div class="cx-grid">' +
                pages.map(function (c) {
                  var ok = have.indexOf(c.key) >= 0, w = where[c.key];
                  return '<button class="cx' + (ok ? '' : ' locked') + '" data-cx="' + esc(c.key) + '"><span class="gl">' + (ok ? esc(c.glyph) : '?') + '</span><span><b>' + esc(ok ? c.title : '???') + '</b><small>' +
                    (ok ? 'Read' : w ? 'Learn it in ' + esc(w.l.name) + ' (' + esc(w.t.name) + ')' : 'Not on the road yet') + '</small></span></button>';
                }).join('') + '</div>';
            }).join('') + '</div>';
          panel.addEventListener('click', function (e) {
            var b = e.target.closest('[data-cx]');
            if (b && !b.classList.contains('locked')) { DR.Sound.sfx('page'); codexModal(b.dataset.cx); }
          });
        }
        function codexModal(key) {
          var c = C.codex[key];
          if (!c) return;
          var tp = st.catalog.topics.filter(function (t) { return t.key === c.topic; })[0];
          var m = DR.modal('<div class="cxm"><span class="gl">' + esc(c.glyph) + '</span><div class="dr-muted" style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;margin-top:8px">' + esc(tp ? tp.name : '') + '</div><h2>' + esc(c.title) + '</h2><p>' + esc(c.text) + '</p>' +
            '<div class="kbx"></div><div style="display:flex;gap:10px;justify-content:space-between;align-items:center"><span class="dr-muted" style="font-size:12.5px">' + esc(c.ex.notes.map(function (n) { return n.split('+').map(function (x) { return M.pretty(x); }).join('+'); }).join('  ·  ')) + '</span>' +
            '<button class="dr-btn gold" data-a="hear">▶ Hear it</button></div></div>', { cls: 'wide' });
          var items = c.ex.notes.map(function (n) { var ns = n.split('+').map(M.parseNote); return ns.length > 1 ? ns : ns[0]; });
          var flat = [];
          items.forEach(function (it) { flat = flat.concat(Array.isArray(it) ? it : [it]); });
          var kb = DR.Keyboard(m.el.querySelector('.kbx'), { skin: st.progress.equip.skins, flats: c.ex.notes.join(' ').indexOf('b') > 0 });
          var r = DR.Engine.rangeFor(flat, window.innerWidth < 600 ? 1 : 2);
          kb.setRange(r[0], r[1]);
          var names = {};
          c.ex.notes.forEach(function (n) { n.split('+').forEach(function (x) { var mm = M.parseNote(x), nn = M.pretty(x, true); if (mm != null) names[mm] = names[mm] && names[mm] !== nn ? names[mm] + '/' + nn : nn; }); });
          kb.mark(flat, 'lesson', names);
          m.el.querySelector('[data-a="hear"]').addEventListener('click', function () { DR.Sound.play(items, { gap: 0.6, dur: 0.75 }); });
          var oc = m.close;
          m.close = function () { kb.destroy(); oc(); };
        }

        /* ---------- collection ---------- */
        function renderCollection(panel) {
          var p = st.progress, s = st.status, where = cardWhere();
          var owned = st.catalog.composers.filter(function (c) { return p.cards[c.key]; }).length;
          var order = st.catalog.composers.slice().sort(function (a, b) { return st.catalog.rarity[a.rarity].order - st.catalog.rarity[b.rarity].order; });
          panel.innerHTML = '<div class="g-page"><h2>Collection</h2><p class="lede">Composer cards, territory crests and your record on the road.</p>' +
            '<div class="g-sec"><h3>Composer cards</h3><span>' + owned + ' / ' + st.catalog.composers.length + '</span></div><div class="cd-grid">' +
            order.map(function (c) {
              var have = p.cards[c.key], w = where[c.key];
              return '<button class="cd r-' + c.rarity + (have ? '' : ' no') + '" data-card="' + esc(c.key) + '">' + (have > 1 ? '<span class="cnt">×' + have + '</span>' : '') +
                '<span class="rar" style="color:' + DR.Art.RARITY_COL[c.rarity] + '">' + esc(st.catalog.rarity[c.rarity].name) + '</span>' + DR.Art.medallion(c, !!have, 86) +
                '<b>' + esc(have ? c.name : '???') + '</b><small>' + esc(have ? c.years : w ? (w.how === 'three' ? '★★★ ' : 'Clear ') + w.x.l.name : 'Daily practice') + '</small></button>';
            }).join('') + '</div>' +
            '<div class="g-sec"><h3>Territory crests</h3><span>' + s.conquered.length + ' conquered · ' + s.mastered.length + ' mastered</span></div><div class="cr-row">' +
            st.journey.map(function (t) { var ts = terrState(t); return '<div class="cr">' + DR.Art.crest(t, ts, 64) + '<small>' + esc(t.name) + '<br><span class="dr-muted">' + ({ locked: 'locked', open: 'in progress', conquered: 'conquered', mastered: 'mastered' }[ts]) + '</span></small></div>'; }).join('') + '</div>' +
            '<div class="g-sec"><h3>Your record</h3></div><div class="stat-grid">' + [
              ['Levels cleared', s.cleared.length + ' / ' + s.levels_max], ['Stars', s.stars + ' / ' + s.stars_max], ['Codex pages', s.codex + ' / ' + s.codex_max],
              ['Notes played right', DR.fmt(p.stats.notes)], ['Chords played right', DR.fmt(p.stats.chords)], ['Ear questions right', DR.fmt(p.stats.ear)],
              ['Quiz answers right', DR.fmt(p.stats.quiz)], ['Perfect hits', DR.fmt(p.stats.perfects)], ['Best combo', DR.fmt(p.stats.max_combo)],
              ['Flawless levels', DR.fmt(p.stats.flawless)], ['Days practised', DR.fmt(p.stats.dailies)], ['Longest streak', DR.fmt(p.daily.best)]
            ].map(function (x) { return '<div class="stat"><small>' + esc(x[0]) + '</small><b>' + esc(x[1]) + '</b></div>'; }).join('') + '</div></div>';
          panel.addEventListener('click', function (e) {
            var b = e.target.closest('[data-card]');
            if (b && !b.classList.contains('no')) { DR.Sound.sfx('card'); cardModal(b.dataset.card); }
          });
        }
        function cardModal(key) {
          var c = C.composers[key];
          if (!c) return;
          DR.modal('<div style="text-align:center"><div style="display:inline-block;padding:10px;border-radius:50%;box-shadow:0 0 40px ' + DR.Art.RARITY_COL[c.rarity] + '55">' + DR.Art.medallion(c, true, 150) + '</div>' +
            '<div style="color:' + DR.Art.RARITY_COL[c.rarity] + ';font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;margin-top:10px">' + esc(st.catalog.rarity[c.rarity].name) + ' · ' + esc(c.era) + '</div>' +
            '<h2 style="font-size:34px;margin:6px 0 2px">' + esc(c.name) + '</h2><div class="dr-muted">' + esc(c.years) + '</div><p style="font-size:16px;line-height:1.6;margin-top:14px">' + esc(c.fact) + '</p></div>');
        }

        /* ---------- practice room ---------- */
        var EXTRA_SCALES = { penta: [0, 2, 4, 7, 9], mpenta: [0, 3, 5, 7, 10], blues: [0, 3, 5, 6, 7, 10] };
        function renderPractice(panel) {
          var keys = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
          var ps = DR.store.get('dr.practice', { show: 'none', key: 'C', chord: 'Cmaj7', bpm: 90 });
          panel.innerHTML = '<div class="pr"><div class="pr-top"><div class="pr-chord"><small>You are playing</small><b class="v-ch">–</b><span class="v-nt">Play anything. Chords are named as you play them.</span></div>' +
            '<div class="pr-tools"><label>Show <select data-k="show">' + [['none', 'Nothing'], ['major', 'Major scale'], ['minor', 'Natural minor'], ['harmonic', 'Harmonic minor'],
              ['penta', 'Major pentatonic'], ['mpenta', 'Minor pentatonic'], ['blues', 'Blues scale'], ['dorian', 'Dorian'], ['mixolydian', 'Mixolydian'], ['chord', 'A chord']].map(function (o) {
              return '<option value="' + o[0] + '"' + (ps.show === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
            '<label class="v-keyl">in <select data-k="key">' + keys.map(function (k) { return '<option' + (ps.key === k ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></label>' +
            '<label class="v-chl">Chord <input type="text" data-k="chord" value="' + esc(ps.chord) + '" spellcheck="false"></label>' +
            '<button class="dr-btn small" data-a="hear">▶ Hear it</button>' +
            '<label>Metronome <input type="range" min="40" max="200" data-k="bpm" value="' + ps.bpm + '"> <b class="v-bpm">' + ps.bpm + '</b></label><button class="dr-btn small" data-a="metro">Start</button></div></div>' +
            '<div class="pr-kbwrap"><div class="pr-info"><span class="v-in"></span><span class="v-keys"></span></div><div class="pr-kb"></div></div></div>';
          var kb = DR.Keyboard(panel.querySelector('.pr-kb'), { skin: st.progress.equip.skins });
          var lo = window.innerWidth < 700 ? 60 : 48, hi = 83;
          kb.setRange(lo, hi);
          DR.Input.setBase(lo);
          DR.Input.capture(true);
          var $ch = panel.querySelector('.v-ch'), $nt = panel.querySelector('.v-nt');
          function info() {
            var mi = DR.Input.midi, b = DR.Input.base;
            panel.querySelector('.v-in').innerHTML = mi.status === 'on' ? '🎹 <b>' + esc(mi.inputs[0]) + '</b>' : '⌨️ <b>Z</b>–<b>M</b> = ' + M.nameOf(b) + ' octave · <b>Q</b>–<b>U</b> = ' + M.nameOf(b + 12) + ' octave · <b>↑ ↓</b> shift';
            panel.querySelector('.v-keys').innerHTML = mi.status === 'on' ? '' : '<a data-a="midi" style="cursor:pointer;color:var(--dr-gold)">Connect MIDI</a>';
          }
          info();
          function heldNow() { return Object.keys(DR.Input.held).map(Number).sort(function (a, b) { return a - b; }); }
          var off = DR.Input.on(function (t, m) {
            if (t === 'midi' || t === 'base') { info(); return; }
            if (t !== 'on' && t !== 'off') return;
            var h = heldNow();
            var show = h.length ? h : [];
            var ch = M.detectChord(show.length >= 2 ? show : []);
            if (show.length === 1) { $ch.textContent = M.nameOf(show[0]).replace(/-?\d+$/, ''); $nt.textContent = M.nameOf(show[0]) + (DR.Input.held[show[0]] === 'midi' ? '' : ''); }
            else if (show.length >= 2) { $ch.textContent = ch ? ch.symbol : '?'; $nt.textContent = (ch ? ch.name + ' · ' : '') + show.map(function (x) { return M.nameOf(x); }).join(' '); }
          });
          function mark() {
            ['target', 'hint', 'lesson'].forEach(function (c) { kb.unmark(c); });
            panel.querySelector('.v-keyl').style.display = ps.show === 'chord' || ps.show === 'none' ? 'none' : '';
            panel.querySelector('.v-chl').style.display = ps.show === 'chord' ? '' : 'none';
            var r = kb.range(), all = [], root = [], names = {};
            if (ps.show === 'chord') {
              var c = M.chordOf(ps.chord);
              if (!c) return;
              var cp = M.pcs(c.notes);
              for (var m = r[0]; m <= r[1]; m++) if (cp.indexOf(mod(m)) >= 0) all.push(m);
              c.notes.forEach(function (n, j) { names[n] = c.spelled[j]; });
              kb.mark(all, 'hint'); kb.mark(c.notes, 'target', names);
              return;
            }
            if (ps.show === 'none') return;
            var pk = M.parseKey(ps.key), steps = EXTRA_SCALES[ps.show] || M.SCALES[ps.show];
            var pcs = steps.map(function (s) { return (pk[0] + s) % 12; });
            var spelled = EXTRA_SCALES[ps.show] ? null : M.scaleNotes(ps.key, ps.show, 4);
            for (var m2 = r[0]; m2 <= r[1]; m2++) {
              var i = pcs.indexOf(mod(m2));
              if (i < 0) continue;
              (i === 0 ? root : all).push(m2);
              names[m2] = spelled ? M.pretty(spelled[i], true) : M.pcName(mod(m2), M.keyUsesFlats(ps.key) || /b/.test(ps.key) || ps.show === 'blues');
            }
            kb.mark(all, 'lesson', names); kb.mark(root, 'target', names);
          }
          function mod(m) { return ((m % 12) + 12) % 12; }
          mark();
          var metro = null;
          function stopMetro() { if (metro) { clearInterval(metro.timer); metro = null; } var b = panel.querySelector('[data-a="metro"]'); if (b) b.textContent = 'Start'; }
          function startMetro() {
            var c = DR.Sound.init(); if (!c) return;
            var next = c.currentTime + 0.1, n = 0;
            metro = { timer: setInterval(function () {
              while (next < c.currentTime + 0.2) { if (n % 4 === 0) DR.Sound.click(next); else DR.Sound.clickSoft(next); next += 60 / ps.bpm; n++; }
            }, 40) };
            panel.querySelector('[data-a="metro"]').textContent = 'Stop';
          }
          function save() { DR.store.set('dr.practice', ps); }
          panel.addEventListener('input', function (e) {
            var k = e.target.dataset.k;
            if (!k) return;
            ps[k] = k === 'bpm' ? +e.target.value : e.target.value;
            if (k === 'bpm') panel.querySelector('.v-bpm').textContent = ps.bpm;
            save(); mark();
          });
          panel.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]');
            if (!a) return;
            if (a.dataset.a === 'metro') { if (metro) stopMetro(); else startMetro(); }
            if (a.dataset.a === 'midi') DR.Input.enableMidi(false).then(info);
            if (a.dataset.a === 'hear') {
              if (ps.show === 'chord') { var c = M.chordOf(ps.chord); if (c) { DR.Sound.play([c.notes], { gap: 1.2, dur: 1.4, roll: true }); } }
              else if (ps.show !== 'none') {
                var pk = M.parseKey(ps.key), steps = (EXTRA_SCALES[ps.show] || M.SCALES[ps.show]).concat([12]);
                DR.Sound.play(steps.map(function (s) { return 60 + pk[0] + s; }), { gap: 0.32, dur: 0.4 });
              }
            }
          });
          st.cleanup = function () { off(); stopMetro(); kb.destroy(); DR.Input.capture(false); };
        }

        /* ---------- badges ---------- */
        function renderBadges(panel) {
          var have = st.progress.badges, n = Object.keys(have).length;
          panel.innerHTML = '<div class="g-page"><h2>Badges</h2><p class="lede">' + n + ' of ' + st.catalog.badges.length + ' earned.</p><div class="bd-grid">' +
            st.catalog.badges.map(function (b) {
              var d = have[b.key];
              return '<div class="bd' + (d ? '' : ' no') + '"><span class="ic dr-emoji">' + b.emoji + '</span><div><b>' + esc(b.name) + '</b><small>' + esc(b.desc) + (d ? '<br><span class="dr-gold-text">Earned ' + esc(d) + '</span>' : '') + '</small></div></div>';
            }).join('') + '</div></div>';
        }

        /* ---------- shop ---------- */
        function miniKb(skin) {
          var s = '<div class="kb skin-' + esc(skin) + '" style="pointer-events:none">', whites = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16], ww = 100 / whites.length;
          whites.forEach(function (w, i) { s += '<div class="k w" style="left:' + i * ww + '%;width:' + ww + '%"></div>'; });
          [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5], [13, 7], [15, 8]].forEach(function (b) { s += '<div class="k b" style="left:' + ((b[1] + 1) * ww - ww * 0.3) + '%;width:' + ww * 0.6 + '%"></div>'; });
          return s + '</div>';
        }
        function trailPv(key) {
          var f = DR.Engine.TRAILS[key] || DR.Engine.TRAILS.lantern;
          return '<div class="pv-trail">' + [60, 64, 67, 71, 62, 69].map(function (m, i) { var c = f(m); return '<i style="height:' + [40, 58, 30, 66, 48, 36][i] + 'px;background:linear-gradient(0deg,' + c[0] + ',' + c[1] + ');box-shadow:0 0 12px ' + c[1] + '"></i>'; }).join('') + '</div>';
        }
        function bannerPv(b) {
          return '<svg viewBox="0 0 200 78" width="100%" height="100%"><rect width="200" height="78" fill="#0f152a"/><line x1="70" y1="10" x2="70" y2="70" stroke="#e8d9b8" stroke-width="3"/><path d="M72,12 h70 l-14,16 l14,16 h-70z" fill="' + b.color + '" stroke="rgba(0,0,0,.4)"/></svg>';
        }
        function renderShop(panel) {
          var p = st.progress;
          var KINDS = [['skins', 'Keyboards', 'How the keys look while you play.'], ['trails', 'Note trails', 'The falling notes in rush challenges.'], ['banners', 'Banners', 'Your colour on the knowledge map.']];
          panel.innerHTML = '<div class="g-page"><h2>The Shop</h2><p class="lede">You have <b class="dr-gold-text">🪙 ' + DR.fmt(p.ducats) + ' ducats</b>. Earn more by clearing levels, winning stars and practising daily.</p>' +
            KINDS.map(function (k) {
              return '<div class="g-sec"><h3>' + k[1] + '</h3><span>' + k[2] + '</span></div><div class="sh-grid">' + st.catalog.shop[k[0]].map(function (x) {
                var own = p.owned[k[0]].indexOf(x.key) >= 0, eq = p.equip[k[0]] === x.key;
                var pv = k[0] === 'skins' ? miniKb(x.key) : k[0] === 'trails' ? trailPv(x.key) : bannerPv(x);
                return '<div class="sh' + (eq ? ' eq' : '') + '"><div class="pv">' + pv + '</div><div><b>' + esc(x.name) + '</b>' + (x.desc ? '<small>' + esc(x.desc) + '</small>' : '') + '</div><div class="row">' +
                  (eq ? '<span class="dr-muted" style="font-size:13px">✓ In use</span>' : own ? '<span class="dr-muted" style="font-size:13px">Owned</span><button class="dr-btn small" data-eq="' + k[0] + ':' + x.key + '">Use</button>'
                    : '<span class="price">🪙 ' + x.price + '</span><button class="dr-btn small ' + (p.ducats >= x.price ? 'gold' : '') + '" data-buy="' + k[0] + ':' + x.key + '"' + (p.ducats >= x.price ? '' : ' disabled') + '>Buy</button>') + '</div></div>';
              }).join('') + '</div>';
            }).join('') + '</div>';
          panel.addEventListener('click', function (e) {
            var b = e.target.closest('[data-buy]'), q = e.target.closest('[data-eq]');
            if (b) { var a = b.dataset.buy.split(':'); act('buy', [a[0], a[1]], 'Haggling…').then(function (r) { if (r && r.ok) { DR.Sound.sfx('coin'); DR.toast('Yours: <b>' + esc(C.shop[a[0]][a[1]].name) + '</b>', 'gold'); (r.report.new_badges || []).forEach(badgeToast); renderHub('shop'); } }); }
            if (q) { var c = q.dataset.eq.split(':'); act('equip', [c[0], c[1]]).then(function (r) { if (r && r.ok) { DR.Sound.sfx('click'); renderHub('shop'); } }); }
          });
        }
        function badgeToast(k) { var b = C.badges[k]; if (b) DR.toast(b.emoji + ' Badge earned: <b>' + esc(b.name) + '</b>', 'gold'); }

        /* ---------- profile & settings ---------- */
        function settingsHTML() {
          var s = DR.settings;
          function tog(k) { return '<span class="tog' + (s[k] ? ' on' : '') + '" data-tog="' + k + '" role="switch" aria-checked="' + !!s[k] + '" tabindex="0"></span>'; }
          var mi = DR.Input.midi;
          return '<div class="pf-set">' +
            '<span>Sound effects</span>' + tog('sfx') +
            '<span>Ambient music on the map</span>' + tog('ambient') +
            '<span>Piano sound for computer keys and clicks</span>' + tog('keySound') +
            '<span>Piano sound for MIDI keys<span class="sub">Turn off if your keyboard has its own speakers.</span></span>' + tog('midiSound') +
            '<span>Metronome during rushes</span>' + tog('metronome') +
            '<span>Computer-key letters on the keys</span>' + tog('letters') +
            '<span>Note names on the keys</span><span class="seg" data-seg="labels">' + [['none', 'Off'], ['c', 'C only'], ['all', 'All']].map(function (o) { return '<button data-v="' + o[0] + '" class="' + (s.labels === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</span>' +
            '<span>Volume</span><input type="range" min="0" max="1" step="0.05" value="' + s.volume + '" data-vol>' +
            '<span>MIDI keyboard<span class="sub">' + (mi.status === 'on' ? esc(mi.inputs.join(', ')) : mi.status === 'unsupported' ? 'This browser has no Web MIDI. Use Chrome or Edge.' : mi.status === 'denied' ? 'Blocked. Allow MIDI in the browser\'s site settings.' : mi.status === 'ready' ? 'Allowed, but no keyboard found. Plug one in.' : 'Not connected.') + '</span></span>' +
            (mi.status === 'on' || mi.status === 'unsupported' ? '<span></span>' : '<button class="dr-btn small" data-a="midi">Connect</button>') + '</div>';
        }
        function bindSettings(el, redraw) {
          el.addEventListener('click', function (e) {
            var t = e.target.closest('[data-tog]'), sg = e.target.closest('[data-seg] button'), a = e.target.closest('[data-a="midi"]');
            if (t) {
              var k = t.dataset.tog; DR.settings[k] = !DR.settings[k]; DR.saveSettings();
              if (k === 'ambient') DR.Sound.ambient(DR.settings.ambient && st.screen === 'hub');
              redraw();
            }
            if (sg) { DR.settings[sg.closest('[data-seg]').dataset.seg] = sg.dataset.v; DR.saveSettings(); if (stage) stage.keyboard.relabel(); redraw(); }
            if (a) DR.Input.enableMidi(false).then(redraw);
          });
          el.addEventListener('input', function (e) { if (e.target.hasAttribute('data-vol')) DR.Sound.setVolume(+e.target.value); });
        }
        function settingsModal() {
          var m = DR.modal('<h2 style="font-size:28px">Settings</h2><div class="v-set"></div>');
          var box = m.el.querySelector('.v-set');
          function draw() { box.innerHTML = settingsHTML(); if (stage) stage.keyboard.relabel(); }
          draw(); bindSettings(box, draw);
        }
        function profile() {
          var s = st.status, r = s.rank;
          var m = DR.modal('<div style="display:flex;gap:16px;align-items:center"><div class="g-avatar" style="width:64px;height:64px;font-size:28px;display:flex;align-items:center;justify-content:center">' + esc((st.me.name || '?').charAt(0).toUpperCase()) + '</div>' +
            '<div><h2 style="font-size:30px">' + esc(st.me.name) + '</h2><div class="dr-gold-text" style="font-weight:600">' + esc(r.name) + ' · ' + DR.fmt(r.xp) + ' XP' + (r.next ? ' <span class="dr-muted">(' + DR.fmt(r.next - r.xp) + ' to ' + esc(st.catalog.ranks[r.idx + 1].name) + ')</span>' : '') + '</div>' +
            '<div class="dr-muted" style="font-size:13px">' + (st.guest ? 'Playing as a guest: progress lives in this browser.' : esc(st.me.email)) + '</div></div></div>' +
            (st.guest ? '' : '<div style="display:flex;gap:8px;margin-top:14px"><input class="dr-input v-name" maxlength="24" value="' + esc(st.me.name) + '"><button class="dr-btn" data-a="name">Rename</button></div>') +
            '<hr class="dr-rule"><h3 style="font-size:20px">Settings</h3><div class="v-set"></div><hr class="dr-rule">' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">' + (st.me.is_admin ? '<button class="dr-btn" data-a="admin">Level editor</button>' : '') +
            '<button class="dr-btn" data-a="how">How to play</button>' +
            (st.guest ? '<button class="dr-btn gold" data-a="signup">Create an account</button><button class="dr-btn" data-a="login">Sign in</button>' : '<button class="dr-btn" data-a="signout">Sign out</button>') + '</div>', { cls: 'wide' });
          var box = m.el.querySelector('.v-set');
          function draw() { box.innerHTML = settingsHTML(); }
          draw(); bindSettings(box, draw);
          m.el.addEventListener('click', function (e) {
            var a = e.target.closest('[data-a]');
            if (!a || a.dataset.a === 'midi') return;
            var w = a.dataset.a;
            if (w === 'name') {
              var v = m.el.querySelector('.v-name').value;
              call('set_name', [v, DR.today()]).then(function (r) { if (r && r.ok) { apply(r); m.close(); DR.toast('Name saved', 'gold'); renderHub(st.tab); } else DR.toast(esc((r && r.error) || 'Could not rename.'), 'err'); });
            } else if (w === 'admin') { m.close(); emit('admin'); }
            else if (w === 'how') howTo();
            else if (w === 'signup' || w === 'login') { m.close(); authModal(w); }
            else if (w === 'signout') { m.close(); emit('logout').then(function () { st.signedIn = false; st.guest = true; renderTitle(); }); }
          });
        }

        /* ---------- debug hooks for the local tests ---------- */
        window.DR_GAME_DEBUG = {
          st: function () { return st; }, play: play, renderHub: renderHub, renderTitle: renderTitle, startGuest: startGuest,
          stage: function () { return stage; }, levelModal: levelModal, codexModal: codexModal, cardModal: cardModal, profile: profile, dailyModal: dailyModal,
          auto: function (on, scale) { DR.Stage.debug.auto = !!on; DR.Stage.debug.timeScale = scale || 1; }
        };

        if (st.signedIn) startSignedIn(); else renderTitle();
        return {};
      });
    })();
    </script>

