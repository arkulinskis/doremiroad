                var choices = s.mode === 'chord' ? Object.keys(M.EAR_CHORDS) : Object.keys(M.INTERVALS);
                h += '<div class="dr-field"><label>Answers to choose from</label><div class="a-chips">' + choices.map(function (x) {
                  return '<button class="a-cx' + ((s.pool || []).indexOf(x) >= 0 ? ' on' : '') + '" data-pool="' + esc(x) + '">' + esc(s.mode === 'interval' ? M.INTERVALS[x][1] : x) + '</button>'; }).join('') + '</div></div>';
              }
              break;
            case 'quiz':
              h += inp('q', 'Question', s.q) + '<div class="dr-field"><label>Answers (tick the right one; empty ones are skipped; the game shuffles them)</label>' +
                [0, 1, 2, 3, 4, 5].map(function (j) {
                  return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="radio" name="ans' + i + '" data-ans="' + j + '"' + ((s.answer || 0) === j ? ' checked' : '') + '><input class="dr-input" data-opt="' + j + '" value="' + esc((s.options || [])[j] || '') + '"></div>';
                }).join('') + '</div>' + inp('explain', 'Explanation (shown after answering)', s.explain);
              break;
          }
          h += '<div class="a-prev"></div>';
          return h;
        }
        function preview(s) {
          try {
            if (s.t === 'progression') { var cs = (s.numerals || []).map(function (n) { var c = M.parseNumeral(n, s.key); return c ? c.symbol : '?'; }); return 'In ' + esc(M.keyName(s.key)) + ': <b>' + esc(cs.join(' – ')) + '</b>'; }
            if (s.t === 'chords') return (s.chords || []).map(function (x) { var c = M.chordOf(x); return c ? '<b>' + esc(c.symbol) + '</b> = ' + esc(c.spelled.join(' ')) : '<span style="color:#f2a39b">' + esc(x) + '?</span>'; }).join(' · ');
            if (s.t === 'rush') { var p = M.parseSeq(s.seq); if (!p) return ''; var secs = p[1] * 60 / (s.bpm || 90); return '<b>' + p[0].length + '</b> notes · ' + p[1] + ' beats · about ' + Math.round(secs) + ' s'; }
            if (s.t === 'notes') return (s.notes || []).map(function (x) { return M.parseNote(x) == null ? '<span style="color:#f2a39b">' + esc(x) + '?</span>' : esc(M.pretty(x)); }).join(' ');
          } catch (e) {}
          return '';
        }
        function drawSteps() {
          var box = root.querySelector('.v-steps'), steps = A.cur.data.steps;
          box.innerHTML = steps.map(function (s, i) {
            var col = A.collapsed[i];
            return '<div class="a-step" data-i="' + i + '"><div class="a-sh"><span class="n">' + (i + 1) + '</span><span class="dr-emoji">' + (DR.Art.STEP_ICONS[s.t] || '') + '</span><b>' + esc(DR.Art.STEP_NAMES[s.t] || s.t) + '</b><span class="sp">' + esc(stepSummary(s)) + '</span>' +
              (s.t === 'rush' || s.t === 'lesson' || s.t === 'notes' || s.t === 'chords' || s.t === 'progression' ? '<button class="dr-btn small ghost" data-st="hear" title="Hear it">▶</button>' : '') +
              '<button class="dr-btn small ghost" data-st="up" title="Move up">▲</button><button class="dr-btn small ghost" data-st="down" title="Move down">▼</button>' +
              '<button class="dr-btn small ghost" data-st="dup" title="Duplicate">⧉</button><button class="dr-btn small ghost" data-st="fold" title="Fold">' + (col ? '▸' : '▾') + '</button><button class="dr-btn small ghost" data-st="del" title="Delete">✕</button></div>' +
              '<div class="a-sb' + (col ? ' col' : '') + '">' + fieldsFor(s, i) + '</div></div>';
          }).join('') || '<div class="a-card dr-muted">No steps yet. Add one below.</div>';
          box.querySelectorAll('.a-step').forEach(function (el, i) { var pv = el.querySelector('.a-prev'); if (pv) pv.innerHTML = preview(steps[i]); });
          box.oninput = function (e) {
            var el = e.target.closest('.a-step'); if (!el) return;
            var i = +el.dataset.i, s = steps[i], f = e.target.dataset.s;
            if (e.target.dataset.opt != null) { s.options = s.options || []; s.options[+e.target.dataset.opt] = e.target.value; trimOpts(s); }
            else if (e.target.dataset.ans != null) s.answer = +e.target.dataset.ans;
            else if (f) {
              var v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
              if (f === 'notes' || f === 'chords' || f === 'numerals' || f === 'show' || f === 'pool') v = String(v).split(/[\s,]+/).filter(Boolean);
              else if (f === 'labels') v = String(v).split('\n').map(function (x) { return x.trim(); });
              else if (f === 'bpm' || f === 'count') v = parseInt(v, 10) || 0;
              else if (f === 'staff') v = v || null;
              if (f === 'labels') { while (v.length && !v[v.length - 1]) v.pop(); }
              s[f] = v;
              if (f === 'mode') { s.pool = v === 'note' ? ['C4', 'E4', 'G4'] : v === 'chord' ? ['major', 'minor'] : ['M3', 'P5']; dirty(); drawSteps(); return; }
            }
            el.querySelector('.sp').textContent = stepSummary(s);
            var pv = el.querySelector('.a-prev'); if (pv) pv.innerHTML = preview(s);
            dirty();
          };
          box.onchange = box.oninput;
          box.onclick = function (e) {
            var el = e.target.closest('.a-step'); if (!el) return;
            var i = +el.dataset.i, s = steps[i], b = e.target.closest('[data-st]'), pl = e.target.closest('[data-pool]');
            if (pl) { s.pool = s.pool || []; var k = s.pool.indexOf(pl.dataset.pool); if (k >= 0) s.pool.splice(k, 1); else s.pool.push(pl.dataset.pool); pl.classList.toggle('on'); dirty(); return; }
            if (!b) return;
            var w = b.dataset.st;
            if (w === 'del') { if (!window.confirm('Delete step ' + (i + 1) + '?')) return; steps.splice(i, 1); A.collapsed = {}; }
            else if (w === 'up' && i > 0) { steps.splice(i - 1, 0, steps.splice(i, 1)[0]); A.collapsed = {}; }
            else if (w === 'down' && i < steps.length - 1) { steps.splice(i + 1, 0, steps.splice(i, 1)[0]); A.collapsed = {}; }
            else if (w === 'dup') { steps.splice(i + 1, 0, JSON.parse(JSON.stringify(s))); A.collapsed = {}; }
            else if (w === 'fold') { A.collapsed[i] = !A.collapsed[i]; drawSteps(); return; }
            else if (w === 'hear') { hear(s); return; }
            else return;
            dirty(); drawSteps();
          };
        }
        function trimOpts(s) { while (s.options.length && !String(s.options[s.options.length - 1] || '').trim()) s.options.pop(); }
        function hear(s) {
          if (s.t === 'lesson') DR.Sound.play((s.show || []).map(M.parseNote).filter(function (m) { return m != null; }), { gap: 0.45 });
          else if (s.t === 'notes') DR.Sound.play((s.notes || []).map(M.parseNote).filter(function (m) { return m != null; }), { gap: 0.45 });
          else if (s.t === 'chords') DR.Sound.play((s.chords || []).map(M.chordOf).filter(Boolean).map(function (c) { return c.notes; }), { gap: 0.9, dur: 0.85 });
          else if (s.t === 'progression') DR.Sound.play((s.numerals || []).map(function (n) { return M.parseNumeral(n, s.key); }).filter(Boolean).map(function (c) { return c.notes; }), { gap: 0.9, dur: 0.85 });
          else if (s.t === 'rush') {
            var p = M.parseSeq(s.seq); if (!p || !DR.Sound.init()) return;
            var spb = 60 / (s.bpm || 90);
            p[0].forEach(function (e) { setTimeout(function () { DR.Sound.play([e.notes], { gap: e.d * spb, dur: e.d * spb * 0.9 }); }, e.t * spb * 1000); });
          }
        }
        function save() {
          var c = A.cur;
          busy(true, 'Saving…');
          call('save_level', [{ key: c.key, name: c.name, territory: c.territory, published: c.published, data: c.data }]).then(function (r) {
            got(r);
            if (r && r.saved) { A.dirty = false; edit(r.saved); DR.toast(r.errors && r.errors.length ? 'Saved as a draft' : 'Saved', r.errors && r.errors.length ? 'err' : 'gold'); }
          });
        }
        function jsonModal() {
          var m = DR.modal('<h2 style="font-size:26px">Level data</h2><p class="dr-muted" style="font-size:13px">Edit the raw data, or paste a level from somewhere else.</p><textarea class="dr-input mono" style="height:50vh">' + esc(JSON.stringify(A.cur.data, null, 2)) + '</textarea>' +
            '<div class="dr-err"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button class="dr-btn gold" data-a="apply">Apply</button></div>', { cls: 'wide' });
          m.el.querySelector('[data-a="apply"]').addEventListener('click', function () {
            try {
              var d = JSON.parse(m.el.querySelector('textarea').value);
              if (!d || !Array.isArray(d.steps)) throw new Error('It needs a "steps" list.');
              A.cur.data = d; A.dirty = true; m.close(); draw();
            } catch (e) { m.el.querySelector('.dr-err').textContent = e.message; }
          });
        }
        function playtest() {
          var c = A.cur;
          if (check(c.data)[0].length) { DR.toast('Fix the errors first', 'err'); return; }
          pt = document.createElement('div');
          pt.className = 'dr a-playtest';
          pt.innerHTML = '<div class="a-ptbar"><button class="dr-btn small" data-a="stop">✕ End playtest</button></div><div class="v-stage" style="position:absolute;inset:0"></div>';
          document.body.appendChild(pt);
          var stageEl = pt.querySelector('.v-stage');
          var t = A.state.territories.filter(function (x) { return x.key === c.territory; })[0];
          var stg = DR.Stage(stageEl, { name: c.name, data: JSON.parse(JSON.stringify(c.data)) }, {
            subtitle: 'Playtest · ' + (t ? t.name : ''),
            onPause: function () {},
            onFinish: function (res, acc) { endPt(); DR.toast('Cleared with ' + Math.round(acc) + '% · ' + res.items + ' items · score ' + res.score, 'gold'); },
            onFail: function (info) { endPt(); DR.toast(info.reason === 'meter' ? 'Failed: the harmony meter ran out' : 'Not cleared: ' + Math.round(info.accuracy) + '% accuracy', 'err'); }
          });
          A.pt = stg;
          function endPt() { if (!pt) return; stg.destroy(); pt.remove(); pt = null; A.pt = null; }
          pt.querySelector('[data-a="stop"]').addEventListener('click', endPt);
          stg.start();
        }

        /* ---------- territories ---------- */
        function drawTerritories(body) {
          var ts = A.state.territories;
          if (!A.terr || !ts.some(function (t) { return t.key === A.terr.key; })) A.terr = ts[0] ? JSON.parse(JSON.stringify(ts[0])) : null;
          body.innerHTML = '<aside class="a-side">' + ts.map(function (t) {
            return '<button class="a-lv' + (A.terr && A.terr.key === t.key ? ' on' : '') + '" data-t="' + esc(t.key) + '"><span class="dr-emoji">' + esc(t.emoji) + '</span><span class="nm">' + esc(t.name) + '</span>' +
              (t.published ? '' : '<span class="a-chip draft">hidden</span>') + '<span class="a-chip draft">' + t.levels.length + '</span><span class="a-mv" data-mv="-1" data-k="' + esc(t.key) + '">▲</span><span class="a-mv" data-mv="1" data-k="' + esc(t.key) + '">▼</span></button>';
          }).join('') + '<button class="dr-btn small" data-a="newt" style="width:100%;margin-top:8px">＋ New territory</button></aside><main class="a-main"></main>';
          var main = body.querySelector('.a-main');
          function drawForm() {
            var t = A.terr;
            if (!t) { main.innerHTML = '<p class="dr-muted">No territories.</p>'; return; }
            main.innerHTML = '<div class="a-toolbar"><h2>' + esc(t.name || 'New territory') + '</h2>' + (t.key ? '<button class="dr-btn" data-a="delt">Delete</button>' : '') + '<button class="dr-btn gold" data-a="savet">Save</button></div>' +
              '<div class="a-card"><div class="a-row"><div class="dr-field"><label>Name</label><input class="dr-input" data-t="name" maxlength="40" value="' + esc(t.name || '') + '"></div>' +
              '<div class="dr-field narrow"><label>Emoji</label><input class="dr-input" data-t="emoji" maxlength="8" value="' + esc(t.emoji || '') + '"></div>' +
              '<label class="a-check"><input type="checkbox" data-t="published"' + (t.published !== false ? ' checked' : '') + '> Published</label></div>' +
              '<div class="dr-field"><label>Blurb</label><input class="dr-input" data-t="blurb" maxlength="240" value="' + esc(t.blurb || '') + '"></div>' +
              '<div class="dr-field"><label>Colour on the map</label><div class="a-colors">' + A.state.catalog.colors.map(function (c) { return '<span class="a-col' + (t.color === c ? ' on' : '') + '" data-col="' + c + '" style="background:' + c + '"></span>'; }).join('') + '</div></div>' +
              '<div class="a-row"><div class="dr-field"><label>Map position across: <b class="v-x">' + Math.round(t.x) + '</b></label><input type="range" min="3" max="97" data-t="x" value="' + t.x + '"></div>' +
              '<div class="dr-field"><label>Map position down: <b class="v-y">' + Math.round(t.y) + '</b></label><input type="range" min="3" max="97" data-t="y" value="' + t.y + '"></div></div>' +
              '<div class="a-mapprev"></div><p class="dr-muted" style="font-size:12.5px">Territories unlock in this order: each one opens when every level in the one before it is cleared.</p></div>';
            mapPrev();
          }
          function mapPrev() {
            var list = ts.map(function (x) { return x.key === A.terr.key ? Object.assign({}, x, A.terr) : x; });
            if (!A.terr.key) list = list.concat([Object.assign({ levels: [] }, A.terr)]);
            var el = main.querySelector('.a-mapprev');
            if (el) el.innerHTML = DR.Art.map(list, { unlocked: allLevels().map(function (x) { return x.l.key; }).concat(['_']), selected: A.terr.key || '_new', current: A.terr.key });
          }
          drawForm();
          body.querySelector('.a-side').onclick = function (e) {
            var mv = e.target.closest('[data-mv]'), b = e.target.closest('[data-t]'), n = e.target.closest('[data-a="newt"]');
            if (mv) { e.stopPropagation(); busy(true); call('move_territory', [mv.dataset.k, +mv.dataset.mv]).then(function (r) { got(r); draw(); }); return; }
            if (b) { A.terr = JSON.parse(JSON.stringify(ts.filter(function (t) { return t.key === b.dataset.t; })[0])); draw(); }
            if (n) { A.terr = { key: null, name: 'New territory', emoji: '🎵', blurb: '', color: A.state.catalog.colors[ts.length % A.state.catalog.colors.length], x: 50, y: 50, published: false, levels: [] }; drawForm(); }
          };
          main.oninput = function (e) {
            var f = e.target.dataset.t;
            if (!f) return;
            A.terr[f] = e.target.type === 'checkbox' ? e.target.checked : (f === 'x' || f === 'y') ? +e.target.value : e.target.value;
            if (f === 'x' || f === 'y') main.querySelector('.v-' + f).textContent = Math.round(A.terr[f]);
            if (f === 'name') main.querySelector('.a-toolbar h2').textContent = A.terr.name;
            mapPrev();
          };
          main.onclick = function (e) {
            var c = e.target.closest('[data-col]'), a = e.target.closest('[data-a]');
            if (c) { A.terr.color = c.dataset.col; main.querySelectorAll('.a-col').forEach(function (x) { x.classList.toggle('on', x === c); }); mapPrev(); }
            if (!a) return;
            if (a.dataset.a === 'savet') { busy(true, 'Saving…'); call('save_territory', [A.terr]).then(function (r) { got(r); if (!A.terr.key) { var nt = A.state.territories.filter(function (t) { return t.name === A.terr.name; }).pop(); A.terr = nt ? JSON.parse(JSON.stringify(nt)) : null; } DR.toast('Saved', 'gold'); draw(); }); }
            if (a.dataset.a === 'delt') { if (window.confirm('Delete ' + A.terr.name + '?')) { busy(true); call('delete_territory', [A.terr.key]).then(function (r) { got(r); if (r && r.ok !== false) A.terr = null; draw(); }); } }
          };
        }

        /* ---------- players ---------- */
        function drawPlayers(body) {
          body.innerHTML = '<main class="a-main"><h2 style="font-size:28px;margin-bottom:12px">Players</h2><div class="v-pl dr-muted">Loading…</div></main>';
          call('list_players').then(function (r) {
            if (!r || !r.ok) { got(r); return; }
            var el = body.querySelector('.v-pl');
            el.classList.remove('dr-muted');
            el.innerHTML = '<table class="a-table"><tr><th>Name</th><th>Email</th><th>Rank</th><th>Cleared</th><th>Stars</th><th>Conquered</th><th>Codex</th><th>Cards</th><th>Streak</th><th>Last played</th><th>Admin</th></tr>' +
              r.players.map(function (p) {
                return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.email) + '</td><td>' + esc(p.rank) + ' <span class="dr-muted">' + p.xp + '</span></td><td>' + p.cleared + '</td><td>' + p.stars + '</td><td>' + p.conquered + '</td><td>' + p.codex + '</td><td>' + p.cards + '</td><td>' + p.streak + '</td><td>' +
                  esc((p.last_played || '').slice(0, 10)) + '</td><td><input type="checkbox" data-adm="' + esc(p.email) + '"' + (p.is_admin ? ' checked' : '') + '></td></tr>';
              }).join('') + '</table>';
            el.onchange = function (e) {
              var c = e.target.closest('[data-adm]'); if (!c) return;
              call('set_admin', [c.dataset.adm, c.checked]).then(function (r2) { if (!r2 || !r2.ok) { DR.toast(esc((r2 && r2.error) || 'Could not change that.'), 'err'); c.checked = !c.checked; } else DR.toast('Saved', 'gold'); });
            };
          });
        }

        window.addEventListener('keydown', function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && A.tab === 'levels' && A.cur && root.isConnected) { e.preventDefault(); save(); }
        });
        window.addEventListener('beforeunload', function (e) { if (A.dirty && root.isConnected) { e.preventDefault(); e.returnValue = ''; } });

        window.DR_ADMIN_DEBUG = {
          A: function () { return A; }, edit: edit, newLevel: newLevel, save: save, playtest: playtest, check: check, draw: draw,
          setData: function (d) { A.cur.data = d; A.dirty = true; draw(); }
        };
        start();
        return {};
      });
    })();
    </script>
package_name: Doremi_Road
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Main, type: form}
