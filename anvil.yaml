                '<div class="a-row">' + inp('bpm', 'Tempo (BPM)', s.bpm, 'narrow') + '<div style="padding-bottom:12px">' + chk('hint', 'Names on the falling notes', s.hint) + chk('exact', 'Exact octave', s.exact) + '</div></div>';
